<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="病棟ToDo">

<title>病棟ToDo</title>

<style>
* { box-sizing:border-box; }

:root {
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body {
  margin:0;
  background:#f2f2f7;
  color:#111;
}

button,input,select,textarea {
  font:inherit;
}

button {
  border:0;
  border-radius:9px;
  padding:8px 10px;
  font-weight:600;
}

header {
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #ddd;
  padding-top:env(safe-area-inset-top);
}

.headerTop {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 14px 8px;
}

h1 {
  margin:0;
  font-size:21px;
}

.tabs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:0 8px 8px;
}

.tabButton {
  border:0;
  border-radius:9px;
  padding:9px 2px;
  background:#e5e5ea;
  font-weight:700;
  font-size:12px;
}

.tabButton.active {
  background:#007aff;
  color:white;
}

main {
  max-width:850px;
  margin:auto;
  padding:12px;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}

.blue { background:#007aff; color:white; }
.gray { background:#e5e5ea; color:#111; }
.red { background:#ffe5e5; color:#b00020; }
.green { background:#dff6e5; color:#157a32; }
.orange { background:#fff0cf; color:#8a5a00; }

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}

.card {
  background:white;
  border-radius:15px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.card.finished {
  opacity:.55;
}

.patientTop {
  display:grid;
  grid-template-columns:78px 1fr auto;
  gap:7px;
  align-items:center;
}

.room,
.patientName,
.simpleInput {
  width:100%;
  border:1px solid #ccc;
  border-radius:9px;
  padding:9px;
  background:white;
  font-size:16px;
}

.patientName {
  font-weight:700;
}

.moveRow {
  display:flex;
  gap:4px;
}

.statusRow {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}

.detailsBox {
  background:#f7f7f9;
  border-radius:11px;
  margin-top:10px;
  overflow:hidden;
}

.detailsBox summary {
  cursor:pointer;
  padding:10px;
  font-size:14px;
  font-weight:700;
  user-select:none;
}

.detailsContent {
  padding:0 9px 10px;
}

.formRow {
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:6px;
  align-items:center;
  margin-bottom:7px;
}

.formRow input,
.formRow select,
.formRow textarea {
  width:100%;
  min-width:0;
  border:1px solid #ccc;
  border-radius:8px;
  padding:7px;
  background:white;
}

.formRow textarea {
  min-height:90px;
  resize:vertical;
}

.badge {
  border-radius:999px;
  padding:4px 7px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.expired { background:#ffdada; color:#a40000; }
.today { background:#ffe8b3; color:#865700; }
.tomorrow { background:#fff3c7; color:#755800; }
.safe { background:#dff6e5; color:#12692d; }
.none { background:#e5e5ea; color:#666; }
.noPlan { background:#e8e8ed; color:#555; }

.todo {
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.todoMain {
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.todoMain input[type="checkbox"] {
  width:20px;
  height:20px;
}

.todoText {
  flex:1;
  font-size:16px;
  overflow-wrap:anywhere;
}

.done {
  text-decoration:line-through;
  color:#999;
}

.todoMeta {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin:5px 0 0 28px;
}

.tag {
  padding:3px 7px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}

.high { background:#ffdada; color:#a00000; }
.normal { background:#e5e5ea; }
.low { background:#e8f3ff; color:#1467a5; }
.dateTag { background:#eeeafc; color:#51409a; }
.overdueTag { background:#ffdada; color:#a00000; }

.todoEntry {
  display:grid;
  grid-template-columns:1fr 92px 140px auto;
  gap:5px;
  margin-top:10px;
}

.todoEntry input,
.todoEntry select {
  width:100%;
  min-width:0;
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  background:white;
}

.sectionTitle {
  font-size:18px;
  font-weight:800;
  margin-bottom:4px;
}

.smallText {
  font-size:12px;
  color:#666;
}

.empty {
  text-align:center;
  color:#888;
  margin-top:50px;
}

.subTabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:12px;
}

.subTab {
  background:#e5e5ea;
}

.subTab.active {
  background:#007aff;
  color:white;
}

.bloodPatientRow {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 4px;
  border-bottom:1px solid #eee;
}

.bloodPatientRow input {
  width:22px;
  height:22px;
}

.bloodPatientName {
  font-weight:700;
}

.registeredBadge {
  background:#dff6e5;
  color:#157a32;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:700;
}

.calendarHeader {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}

.calendarTitle {
  text-align:center;
  font-size:20px;
  font-weight:800;
}

.weekHeader,
.calendarGrid {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}

.weekHeader div {
  text-align:center;
  font-size:12px;
  color:#666;
  font-weight:700;
}

.dayCell {
  min-height:100px;
  background:white;
  border-radius:8px;
  padding:5px;
  overflow:hidden;
}

.dayCell.otherMonth {
  opacity:.32;
}

.dayCell.todayCell {
  outline:2px solid #007aff;
}

.dayNumber {
  font-size:12px;
  font-weight:800;
  margin-bottom:4px;
}

.calTodo {
  border-radius:5px;
  padding:3px 4px;
  margin-bottom:3px;
  font-size:10px;
  line-height:1.25;
  background:#ffdada;
  overflow:hidden;
}

.calTodo.completed {
  opacity:.45;
  text-decoration:line-through;
}

.moreLabel {
  font-size:10px;
  color:#666;
  font-weight:700;
}

.handoffOverlay {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#f2f2f7;
  overflow:auto;
  padding-top:env(safe-area-inset-top);
}

.handoffHeader {
  position:sticky;
  top:0;
  background:white;
  border-bottom:1px solid #ddd;
  padding:10px;
  z-index:2;
}

.handoffBody {
  padding:12px;
  max-width:850px;
  margin:auto;
  padding-bottom:40px;
}

.handoffTextarea {
  width:100%;
  min-height:70vh;
  border:1px solid #bbb;
  border-radius:12px;
  padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;
  line-height:1.45;
  resize:vertical;
}

#outpatientView,
#bloodView,
#calendarView {
  display:none;
}

@media(max-width:550px) {
  .tabs {
    font-size:11px;
  }

  .patientTop {
    grid-template-columns:74px 1fr auto;
  }

  .todoEntry {
    grid-template-columns:1fr 1fr;
  }

  .todoEntry .todoTextInput {
    grid-column:1 / 3;
  }

  .dayCell {
    min-height:86px;
    padding:4px 3px;
  }

  .calTodo {
    font-size:9px;
  }

  .formRow {
    grid-template-columns:65px 1fr;
  }

  .formRow > :last-child.badge,
  .formRow > button {
    grid-column:2;
  }
}
</style>
</head>

<body>

<header>
  <div class="headerTop">
    <h1>病棟 ToDo</h1>
    <button class="blue" onclick="addPatientFromCurrentTab()">＋患者</button>
  </div>

  <div class="tabs">
    <button id="wardTabButton" class="tabButton active" onclick="showTab('ward')">病棟患者</button>
    <button id="outpatientTabButton" class="tabButton" onclick="showTab('outpatient')">外来患者</button>
    <button id="bloodTabButton" class="tabButton" onclick="showTab('blood')">採血</button>
    <button id="calendarTabButton" class="tabButton" onclick="showTab('calendar')">カレンダー</button>
  </div>
</header>

<main>

<section id="wardView">
  <div class="toolbar">
    <button class="gray" onclick="sortWardByRoom()">部屋順ソート</button>
    <button class="blue" onclick="openHandoff()">申し送り作成</button>
    <button class="gray" onclick="deleteCompletedTodos()">✓ 完了ToDo削除</button>
  </div>

  <div class="toolbar">
    <button class="red" onclick="deleteFinishedPatients()">完了患者削除</button>
    <button class="gray" onclick="backupData()">バックアップ保存</button>
    <button class="gray" onclick="document.getElementById('restoreFile').click()">バックアップ復元</button>

    <input
      id="restoreFile"
      type="file"
      accept=".json,application/json"
      style="display:none"
    >
  </div>

  <div id="wardPatients"></div>
  <div id="wardEmpty" class="empty">＋患者 から追加してください</div>
</section>


<section id="outpatientView">
  <div class="toolbar">
    <button class="gray" onclick="backupData()">バックアップ保存</button>
  </div>

  <div id="outpatientPatients"></div>
  <div id="outpatientEmpty" class="empty">外来患者はいません</div>
</section>


<section id="bloodView">

  <div class="card">
    <div class="sectionTitle">今日の採血</div>
    <div class="smallText" style="margin-bottom:12px;">
      患者を選択すると今日のToDoに「採血」を通常優先度で追加します。
    </div>

    <div class="subTabs">
      <button id="bloodWardButton" class="subTab active" onclick="switchBloodGroup('ward')">
        入院
      </button>

      <button id="bloodOutpatientButton" class="subTab" onclick="switchBloodGroup('outpatient')">
        外来
      </button>
    </div>

    <div class="toolbar">
      <button class="gray" onclick="selectAllBlood()">全選択</button>
      <button class="gray" onclick="clearAllBlood()">全解除</button>
    </div>

    <div id="bloodPatientList"></div>

    <button
      class="blue"
      style="width:100%;margin-top:12px;padding:11px;"
      onclick="addBloodTodos()"
    >
      選択患者に採血ToDoを追加
    </button>
  </div>

</section>


<section id="calendarView">

  <div class="calendarHeader">
    <button class="gray" onclick="changeMonth(-1)">‹</button>
    <div id="calendarTitle" class="calendarTitle"></div>
    <button class="gray" onclick="changeMonth(1)">›</button>
  </div>

  <div class="toolbar">
    <button class="gray" onclick="goToday()">今月</button>
  </div>

  <div class="smallText" style="margin-bottom:10px;">
    優先度「高」のToDoのみ表示します。
  </div>

  <div class="weekHeader">
    <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
  </div>

  <div id="calendarGrid" class="calendarGrid"></div>

</section>

</main>


<div id="handoffOverlay" class="handoffOverlay">

  <div class="handoffHeader">
    <div class="toolbar" style="margin:0;">
      <button class="gray" onclick="closeHandoff()">← 戻る</button>
      <button class="blue" onclick="generateHandoff()">再生成</button>
      <button class="green" onclick="copyHandoff()">全文コピー</button>
    </div>
  </div>

  <div class="handoffBody">
    <textarea id="handoffText" class="handoffTextarea"></textarea>
  </div>

</div>


<script>

/* =========================================
   基本
========================================= */

const KEY = "hospiTodo";

let activeMainTab = "ward";
let bloodGroup = "ward";


function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}


function formatDateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}


function todayString() {
  return formatDateLocal(new Date());
}


function tomorrowString() {
  const d = new Date();
  d.setDate(d.getDate()+1);
  return formatDateLocal(d);
}


function displayDate(s) {
  if(!s) return "";

  const a = s.split("-");

  if(a.length !== 3) return s;

  return String(a[1]).padStart(2,"0") + "/" + String(a[2]).padStart(2,"0");
}


function defaultDateState() {
  return {
    date:"",
    noPlan:false
  };
}


function normalizeDateState(value) {

  if(typeof value === "string") {
    return {
      date:value,
      noPlan:false
    };
  }

  return {
    date:value?.date || "",
    noPlan:!!value?.noPlan
  };
}


/* =========================================
   データ読込・移行
========================================= */

let patients = [];

try {
  patients = JSON.parse(localStorage.getItem(KEY)) || [];
} catch(e) {
  patients = [];
}


function normalizePatients(data) {

  return (data || []).map(p => {

    const oldOrders = p.orders || {};

    const orders = {
      blood:normalizeDateState(oldOrders.blood),
      drip:normalizeDateState(oldOrders.drip),
      procedure:normalizeDateState(oldOrders.procedure),
      prescription:normalizeDateState(oldOrders.prescription)
    };

    const todos = (p.todos || []).map(t => {

      let dueDate = t.dueDate || "";

      if(!dueDate) {
        if(t.timing === "today") {
          dueDate = todayString();
        } else if(t.timing === "tomorrow") {
          dueDate = tomorrowString();
        }
      }

      return {
        id:String(t.id || uid()),
        text:t.text || "",
        done:!!t.done,
        priority:t.priority || "normal",
        dueDate
      };
    });

    return {
      id:String(p.id || uid()),

      location:
        p.location === "outpatient"
          ? "outpatient"
          : "ward",

      room:p.room || "",
      initial:p.initial || "",
      finished:!!p.finished,

      admissionDate:p.admissionDate || "",
      dischargeDate:p.dischargeDate || "",

      plannedAdmission:
        normalizeDateState(
          p.plannedAdmission ||
          p.admissionPlan
        ),

      plannedAdmissionRoom:
        p.plannedAdmissionRoom || "",

      plannedDischarge:
        normalizeDateState(
          p.plannedDischarge ||
          p.dischargePlan
        ),

      orders,
      todos,

      handoff:{
        regimen:p.handoff?.regimen || "",
        mood:p.handoff?.mood || "",
        note:p.handoff?.note || "",
        category:
          p.handoff?.category === "consult"
            ? "consult"
            : "ward"
      }
    };
  });
}


patients = normalizePatients(patients);
save();


function save() {
  localStorage.setItem(KEY,JSON.stringify(patients));
}


/* =========================================
   タブ
========================================= */

function showTab(tab) {

  activeMainTab = tab;

  const views = {
    ward:"wardView",
    outpatient:"outpatientView",
    blood:"bloodView",
    calendar:"calendarView"
  };

  const buttons = {
    ward:"wardTabButton",
    outpatient:"outpatientTabButton",
    blood:"bloodTabButton",
    calendar:"calendarTabButton"
  };

  Object.values(views).forEach(id => {
    document.getElementById(id).style.display = "none";
  });

  Object.values(buttons).forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  document.getElementById(views[tab]).style.display = "block";
  document.getElementById(buttons[tab]).classList.add("active");

  if(tab === "ward") renderWard();
  if(tab === "outpatient") renderOutpatient();
  if(tab === "blood") renderBloodPatients();
  if(tab === "calendar") renderCalendar();
}


/* =========================================
   患者追加・基本
========================================= */

function newPatient(location) {

  return {
    id:uid(),
    location,
    room:"",
    initial:"",
    finished:false,

    admissionDate:"",
    dischargeDate:"",

    plannedAdmission:defaultDateState(),
    plannedAdmissionRoom:"",

    plannedDischarge:defaultDateState(),

    orders:{
      blood:defaultDateState(),
      drip:defaultDateState(),
      procedure:defaultDateState(),
      prescription:defaultDateState()
    },

    todos:[],

    handoff:{
      regimen:"",
      mood:"",
      note:"",
      category:"ward"
    }
  };
}


function addPatientFromCurrentTab() {

  let location =
    activeMainTab === "outpatient"
      ? "outpatient"
      : "ward";

  patients.push(
    newPatient(location)
  );

  save();

  showTab(location);
}


function updatePatient(id,key,value) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  p[key] = value;

  save();
}


function deletePatient(id) {

  if(!confirm("この患者を削除しますか？")) return;

  patients = patients.filter(p => p.id !== id);

  save();

  renderAll();
}


function toggleFinished(id) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  p.finished = !p.finished;

  save();
  renderWard();
}


function deleteFinishedPatients() {

  const count =
    patients.filter(
      p =>
        p.location === "ward" &&
        p.finished
    ).length;

  if(!count) {
    alert("完了患者はいません");
    return;
  }

  if(!confirm(`完了患者 ${count}名を削除しますか？`)) return;

  patients =
    patients.filter(
      p =>
        !(p.location === "ward" && p.finished)
    );

  save();
  renderWard();
}


/* =========================================
   病棟↔外来
========================================= */

function moveToOutpatient(id) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  if(!confirm("この患者を外来患者へ移動しますか？")) return;

  p.location = "outpatient";

  if(!p.dischargeDate) {
    p.dischargeDate = todayString();
  }

  save();

  renderAll();
}


function moveToWard(id) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  if(!confirm("この患者を病棟患者へ移動しますか？")) return;

  p.location = "ward";

  if(!p.admissionDate) {
    p.admissionDate = todayString();
  }

  if(
    p.plannedAdmission?.date &&
    !p.room &&
    p.plannedAdmissionRoom
  ) {
    p.room = p.plannedAdmissionRoom;
  }

  save();

  renderAll();
}


/* =========================================
   部屋順
========================================= */

function roomSortKey(room) {

  const text = String(room || "").trim();

  if(!text) return [999999,text];

  const nums = text.match(/\d+/g);

  if(nums?.length) {
    return [
      Number(nums.join("").slice(0,8)),
      text
    ];
  }

  return [999998,text];
}


function compareRooms(a,b) {

  const ka = roomSortKey(a.room);
  const kb = roomSortKey(b.room);

  if(ka[0] !== kb[0]) {
    return ka[0] - kb[0];
  }

  return ka[1].localeCompare(
    kb[1],
    "ja",
    {numeric:true}
  );
}


function sortWardByRoom() {

  const ward =
    patients
      .filter(p => p.location === "ward")
      .sort(compareRooms);

  const outpatient =
    patients.filter(
      p => p.location === "outpatient"
    );

  patients = [
    ...ward,
    ...outpatient
  ];

  save();
  renderWard();
}


/* =========================================
   日付 / 予定なし
========================================= */

function updateDateState(id,group,key,date) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  if(group === "orders") {

    p.orders[key].date = date;
    p.orders[key].noPlan = false;

  } else {

    p[key].date = date;
    p[key].noPlan = false;
  }

  save();

  if(activeMainTab === "ward") renderWard();
  if(activeMainTab === "outpatient") renderOutpatient();
}


function toggleNoPlan(id,group,key) {

  const p = patients.find(p => p.id === id);

  if(!p) return;

  let state;

  if(group === "orders") {
    state = p.orders[key];
  } else {
    state = p[key];
  }

  state.noPlan = !state.noPlan;

  if(state.noPlan) {
    state.date = "";
  }

  save();

  if(activeMainTab === "ward") renderWard();
  if(activeMainTab === "outpatient") renderOutpatient();
}


function dateStatus(state) {

  state = normalizeDateState(state);

  if(state.noPlan) {
    return {
      text:"予定なし",
      cls:"noPlan"
    };
  }

  if(!state.date) {
    return {
      text:"未入力",
      cls:"none"
    };
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  const d = new Date(
    state.date + "T00:00:00"
  );

  const diff = Math.round(
    (d - today) / 86400000
  );

  if(diff < 0) {
    return {
      text:"期限切れ",
      cls:"expired"
    };
  }

  if(diff === 0) {
    return {
      text:"今日",
      cls:"today"
    };
  }

  if(diff === 1) {
    return {
      text:"明日",
      cls:"tomorrow"
    };
  }

  return {
    text:`${diff}日先`,
    cls:"safe"
  };
}


/* =========================================
   ToDo
========================================= */

function addTodo(id) {

  const textEl =
    document.getElementById(
      "text-" + id
    );

  const priorityEl =
    document.getElementById(
      "priority-" + id
    );

  const dateEl =
    document.getElementById(
      "date-" + id
    );

  if(!textEl) return;

  const text =
    textEl.value.trim();

  if(!text) return;

  const p =
    patients.find(
      p => p.id === id
    );

  if(!p) return;

  p.todos.push({
    id:uid(),
    text,
    done:false,
    priority:
      priorityEl?.value ||
      "normal",
    dueDate:
      dateEl?.value ||
      todayString()
  });

  save();

  if(p.location === "ward") {
    renderWard();
  } else {
    renderOutpatient();
  }
}


function toggleTodo(
  patientId,
  todoId
) {

  const p =
    patients.find(
      p => p.id === patientId
    );

  if(!p) return;

  const t =
    p.todos.find(
      t => t.id === todoId
    );

  if(!t) return;

  t.done = !t.done;

  save();
  renderAll();
}


function deleteTodo(
  patientId,
  todoId
) {

  const p =
    patients.find(
      p => p.id === patientId
    );

  if(!p) return;

  p.todos =
    p.todos.filter(
      t => t.id !== todoId
    );

  save();
  renderAll();
}


function deleteCompletedTodos() {

  const count =
    patients.reduce(
      (n,p) =>
        n +
        p.todos.filter(
          t => t.done
        ).length,
      0
    );

  if(!count) {
    alert("完了済みToDoはありません");
    return;
  }

  if(!confirm(`完了済みToDo ${count}件を削除しますか？`)) return;

  patients.forEach(p => {
    p.todos =
      p.todos.filter(
        t => !t.done
      );
  });

  save();
  renderAll();
}


function priorityText(v) {
  if(v === "high") return "高";
  if(v === "low") return "低";
  return "通常";
}


function todoDateText(
  dateStr,
  done
) {

  if(!dateStr) {
    return {
      text:"日付未設定",
      cls:"dateTag"
    };
  }

  const today =
    todayString();

  if(dateStr === today) {
    return {
      text:"今日",
      cls:"dateTag"
    };
  }

  if(
    dateStr ===
    tomorrowString()
  ) {
    return {
      text:"明日",
      cls:"dateTag"
    };
  }

  if(
    dateStr < today &&
    !done
  ) {
    return {
      text:"期限超過 " + displayDate(dateStr),
      cls:"overdueTag"
    };
  }

  return {
    text:displayDate(dateStr),
    cls:"dateTag"
  };
}

========================================= */

function switchBloodGroup(group) {

  bloodGroup = group;

  document
    .getElementById("bloodWardButton")
    .classList
    .toggle(
      "active",
      group === "ward"
    );

  document
    .getElementById("bloodOutpatientButton")
    .classList
    .toggle(
      "active",
      group === "outpatient"
    );

  renderBloodPatients();
}


function hasTodayBloodTodo(p) {

  const today =
    todayString();

  return p.todos.some(t =>
    t.text === "採血" &&
    t.dueDate === today &&
    !t.done
  );
}


function renderBloodPatients() {

  const box =
    document.getElementById(
      "bloodPatientList"
    );

  box.innerHTML = "";

  const list =
    patients.filter(
      p =>
        p.location === bloodGroup &&
        !p.finished
    );

  if(!list.length) {

    box.innerHTML =
      `<div class="smallText" style="padding:15px 0;">患者がいません</div>`;

    return;
  }

  list.forEach(p => {

    const registered =
      hasTodayBloodTodo(p);

    const row =
      document.createElement(
        "label"
      );

    row.className =
      "bloodPatientRow";

    const check =
      document.createElement(
        "input"
      );

    check.type =
      "checkbox";

    check.className =
      "bloodPatientCheck";

    check.value =
      p.id;

    if(registered) {
      check.disabled = true;
    }

    const text =
      document.createElement(
        "div"
      );

    text.className =
      "bloodPatientName";

    let prefix = "";

    if(
      p.location === "ward" &&
      p.room
    ) {
      prefix =
        p.room + " ";
    }

    text.textContent =
      prefix +
      (
        p.initial ||
        "名称未入力"
      );

    const status =
      document.createElement(
        "div"
      );

    if(registered) {
      status.className =
        "registeredBadge";
      status.textContent =
        "登録済";
    }

    row.append(
      check,
      text,
      status
    );

    box.appendChild(row);
  });
}


function selectAllBlood() {

  document
    .querySelectorAll(
      ".bloodPatientCheck:not(:disabled)"
    )
    .forEach(el => {
      el.checked = true;
    });
}


function clearAllBlood() {

  document
    .querySelectorAll(
      ".bloodPatientCheck"
    )
    .forEach(el => {
      el.checked = false;
    });
}


function addBloodTodos() {

  const selected =
    document.querySelectorAll(
      ".bloodPatientCheck:checked"
    );

  if(!selected.length) {
    alert("採血する患者を選択してください");
    return;
  }

  const today =
    todayString();

  let added = 0;

  selected.forEach(check => {

    const p =
      patients.find(
        p => p.id === check.value
      );

    if(!p) return;

    if(hasTodayBloodTodo(p)) {
      return;
    }

    p.todos.push({
      id:uid(),
      text:"採血",
      done:false,
      priority:"normal",
      dueDate:today
    });

    added++;
  });

  save();
  renderBloodPatients();

  alert(
    `${added}名に採血ToDoを追加しました`
  );
}

/* =========================================

function escapeHTML(str) {

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function makeDateStateHTML(
  p,
  group,
  key,
  label
) {

  const state =
    group === "orders"
      ? p.orders[key]
      : p[key];

  const status =
    dateStatus(state);

  return `
    <div class="formRow">

      <div>${label}</div>

      <input
        type="date"
        value="${state.date || ""}"
        ${state.noPlan ? "disabled" : ""}
        onchange="
          updateDateState(
            '${p.id}',
            '${group}',
            '${key}',
            this.value
          )
        "
      >

      <div>
        <button
          class="${state.noPlan ? "orange" : "gray"}"
          onclick="
            toggleNoPlan(
              '${p.id}',
              '${group}',
              '${key}'
            )
          "
        >
          予定なし
        </button>

        <span
          class="badge ${status.cls}"
          style="margin-left:4px;"
        >
          ${status.text}
        </span>
      </div>

    </div>
  `;
}


function makeTodosHTML(p) {

  let html = "";

  p.todos.forEach(t => {

    const dateInfo =
      todoDateText(
        t.dueDate,
        t.done
      );

    html += `
      <div class="todo">

        <div class="todoMain">

          <input
            type="checkbox"
            ${t.done ? "checked" : ""}
            onchange="
              toggleTodo(
                '${p.id}',
                '${t.id}'
              )
            "
          >

          <div
            class="todoText ${t.done ? "done" : ""}"
          >
            ${escapeHTML(t.text)}
          </div>

          <button
            class="red"
            onclick="
              deleteTodo(
                '${p.id}',
                '${t.id}'
              )
            "

            ×
          </button>

        </div>

        <div class="todoMeta">

          <span class="tag ${t.priority}">
            ${priorityText(t.priority)}
          </span>

          <span class="tag ${dateInfo.cls}">
            ${dateInfo.text}
          </span>

        </div>

      </div>

  return html;
}


function makeTodoEntryHTML(p) {

/* =========================================
   申し送り生成
========================================= */

function handoffPatientHeader(p) {

  let s = "";

  if(p.room) {
    s += p.room + " ";
  }

  s += p.initial || "名称未入力";

  if(p.handoff.regimen) {
    s += " " + p.handoff.regimen;
  }

  if(p.handoff.mood) {
    s += p.handoff.mood;
  }

  return s.trim();
}


function generateHandoff() {

  const today =
    todayString();

  const admitted =
    patients.filter(
      p =>
        p.admissionDate === today
    );

  const discharged =
    patients.filter(
      p =>
        p.dischargeDate === today
    );

  const plannedAdmission =
    patients
      .filter(
        p =>
          p.location === "outpatient" &&
          !p.plannedAdmission.noPlan &&
          p.plannedAdmission.date
      )
      .sort(
        (a,b) =>
          a.plannedAdmission.date
            .localeCompare(
              b.plannedAdmission.date
            )
      );

  const plannedDischarge =
    patients
      .filter(
        p =>
          p.location === "ward" &&
          !p.plannedDischarge.noPlan &&
          p.plannedDischarge.date
      )
      .sort(
        (a,b) =>
          a.plannedDischarge.date
            .localeCompare(
              b.plannedDischarge.date
            )
      );

  const wardMembers =
    patients
      .filter(
        p =>
          p.location === "ward" &&
          p.handoff.category === "ward"
      )
      .sort(compareRooms);

  const consultMembers =
    patients
      .filter(
        p =>
          p.location === "ward" &&
          p.handoff.category === "consult"
      )
      .sort(compareRooms);


  const lines = [];

  lines.push("<申し送り>");
  lines.push("");


  lines.push("☆入院:");

  if(admitted.length) {
    admitted.forEach(p => {
      lines.push(
        handoffPatientHeader(p)
      );
    });
  } else {
    lines.push("なし");
  }

  lines.push("");


  lines.push("☆退院:");

  if(discharged.length) {
    discharged.forEach(p => {
      lines.push(
        handoffPatientHeader(p)
      );
    });
  } else {
    lines.push("なし");
  }

  lines.push("");


  lines.push("☆入院予定:");

  if(plannedAdmission.length) {

    plannedAdmission.forEach(p => {

      let s =
        displayDate(
          p.plannedAdmission.date
        );

      if(p.plannedAdmissionRoom) {
        s +=
          " " +
          p.plannedAdmissionRoom;
      }

      s +=
        " " +
        (
          p.initial ||
          "名称未入力"
        );

      if(p.handoff.regimen) {
        s +=
          " " +
          p.handoff.regimen;
      }

      lines.push(s);
    });

  } else {
    lines.push("なし");
  }

  lines.push("");


  lines.push("☆退院予定:");

  if(plannedDischarge.length) {

    plannedDischarge.forEach(p => {

      let s =
        displayDate(
          p.plannedDischarge.date
        );

      if(p.room) {
        s +=
          " " +
          p.room;
      }

      s +=
        " " +
        (
          p.initial ||
          "名称未入力"
        );

      lines.push(s);
    });

  } else {
    lines.push("なし");
  }

  lines.push("");


  lines.push("☆病棟メンバー");

  if(wardMembers.length) {

    wardMembers.forEach(p => {

      lines.push(
        handoffPatientHeader(p)
      );

      if(p.handoff.note) {
        lines.push(
          p.handoff.note.trim()
        );
      }

      lines.push("");
    });

  } else {
    lines.push("なし");
    lines.push("");
  }


  lines.push("☆兼科");

  if(consultMembers.length) {

    consultMembers.forEach(p => {

      lines.push(
        handoffPatientHeader(p)
      );

      if(p.handoff.note) {
        lines.push(
          p.handoff.note.trim()
        );
      }

      lines.push("");
    });

  } else {
    lines.push("なし");
  }


  document
    .getElementById(
      "handoffText"
    )
    .value =
      lines.join("\n");
}


function openHandoff() {

  generateHandoff();

  document
    .getElementById(
      "handoffOverlay"
    )
    .style.display =
      "block";
}

/* =========================================
   カレンダー
========================================= */

const now = new Date();

let calendarYear =
  now.getFullYear();

let calendarMonth =
  now.getMonth();


function changeMonth(diff) {

  calendarMonth += diff;

  if(calendarMonth < 0) {
    calendarMonth = 11;
    calendarYear--;
  }

  if(calendarMonth > 11) {
    calendarMonth = 0;
    calendarYear++;
  }

  renderCalendar();
}


function goToday() {

  const d =
    new Date();

  calendarYear =
    d.getFullYear();

  calendarMonth =
    d.getMonth();

  renderCalendar();
}


function renderCalendar() {

  const grid =
    document.getElementById(
      "calendarGrid"
    );

  document
    .getElementById(
      "calendarTitle"
    )
    .textContent =
      `${calendarYear}年 ${calendarMonth+1}月`;

  grid.innerHTML = "";

  const first =
    new Date(
      calendarYear,
      calendarMonth,
      1
    );

  const start =
    new Date(first);

  start.setDate(
    1 - first.getDay()
  );

  const today =
    todayString();

  for(
    let i=0;
    i<42;
    i++
  ) {

    const d =
      new Date(start);

    d.setDate(
      start.getDate()+i
    );

    const dateStr =
      formatDateLocal(d);

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "dayCell";

    if(
      d.getMonth() !==
      calendarMonth
    ) {
      cell.classList.add(
        "otherMonth"
      );
    }

    if(dateStr === today) {
      cell.classList.add(
        "todayCell"
      );
    }

    const n =
      document.createElement(
        "div"
      );

    n.className =
      "dayNumber";

    n.textContent =
      d.getDate();

    cell.appendChild(n);


    const todos = [];

    patients.forEach(p => {

      p.todos.forEach(t => {

        if(
          t.dueDate === dateStr &&
          t.priority === "high"
        ) {

          todos.push({
            patient:p,
            todo:t
          });
        }
      });
    });


    todos
      .slice(0,3)
      .forEach(item => {

        const el =
          document.createElement(
            "div"
          );

        el.className =
          "calTodo" +
          (
            item.todo.done
              ? " completed"
              : ""
          );

        let name = "";

        if(
          item.patient.location === "ward" &&
          item.patient.room
        ) {
          name +=
            item.patient.room +
            " ";
        }

        name +=
          item.patient.initial ||
          "?";

        el.textContent =
          name +
          " " +
          item.todo.text;

        cell.appendChild(el);
      });


    if(todos.length > 3) {

      const more =
        document.createElement(
          "div"
        );

      more.className =
        "moreLabel";

      more.textContent =
        `+${todos.length-3}件`;

      cell.appendChild(more);
    }

    grid.appendChild(cell);
  }
}


/* =========================================
   Backup
========================================= */

async function backupData() {

  const backup = {
    app:"Hospi Todo",
    version:5,
    exportedAt:new Date().toISOString(),
    patients
  };

  const json =
    JSON.stringify(
      backup,
      null,
      2
    );

  const blob =
    new Blob(
      [json],
      {
        type:"application/json"
      }
    );

  const now =
    new Date();

  const filename =
    "hospi-todo-backup-" +
    formatDateLocal(now) +
    "-" +
    String(now.getHours()).padStart(2,"0") +
    String(now.getMinutes()).padStart(2,"0") +
    ".json";

  const file =
    new File(
      [blob],
      filename,
      {
        type:"application/json"
      }
    );

  if(
    navigator.canShare &&
    navigator.canShare({
      files:[file]
    })
  ) {

    try {

      await navigator.share({
        files:[file],
        title:"病棟ToDoバックアップ"
      });

      return;

    } catch(e) {

      if(e.name === "AbortError") {
        return;
      }
    }
  }

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );
}


document
  .getElementById(
    "restoreFile"
  )
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if(!file) return;

      const reader =
        new FileReader();

      reader.onload =
        function() {

          try {

            const backup =
              JSON.parse(
                reader.result
              );

            if(
              !backup ||
              !Array.isArray(
                backup.patients
              )
            ) {
              alert(
                "バックアップ形式が正しくありません"
              );
              return;
            }

            if(
              !confirm(
                "現在のデータをバックアップ内容で上書きしますか？"
              )
            ) return;

            patients =
              normalizePatients(
                backup.patients
              );

            save();
            renderAll();

            alert(
              "バックアップを復元しました"
            );

          } catch(e) {

            alert(
              "バックアップを読み込めませんでした"
            );
          }

          event.target.value = "";
        };

      reader.readAsText(file);
    }
  );
