<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="病棟ToDo">

<title>病棟ToDo</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

body {
  margin: 0;
  background: #f2f2f7;
  color: #111;
}

button,
input,
select {
  font: inherit;
}

header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid #ddd;
  padding-top: env(safe-area-inset-top);
}

.headerTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 14px 8px;
}

h1 {
  margin: 0;
  font-size: 21px;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 0 12px 8px;
  gap: 6px;
}

.tabButton {
  border: 0;
  border-radius: 9px;
  padding: 9px;
  background: #e5e5ea;
  font-weight: 700;
}

.tabButton.active {
  background: #007aff;
  color: white;
}

main {
  padding: 12px;
  max-width: 800px;
  margin: auto;
  padding-bottom:
    calc(30px + env(safe-area-inset-bottom));
}

button {
  border: 0;
  border-radius: 9px;
  padding: 8px 10px;
  font-weight: 600;
}

.blue {
  background: #007aff;
  color: white;
}

.gray {
  background: #e5e5ea;
  color: #111;
}

.red {
  background: #ffe5e5;
  color: #b00020;
}

.green {
  background: #dff6e5;
  color: #157a32;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 10px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.card.finished {
  opacity: .55;
}

.patientTop {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 7px;
  align-items: center;
}

.room,
.initial {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 9px;
  padding: 9px;
  background: white;
  font-size: 16px;
}

.initial {
  font-weight: 700;
  text-transform: uppercase;
}

.moveRow {
  display: flex;
  gap: 4px;
}

.statusRow {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* オーダー折りたたみ */

.orderDetails {
  background: #f7f7f9;
  border-radius: 11px;
  margin-top: 10px;
  overflow: hidden;
}

.orderDetails summary {
  cursor: pointer;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  user-select: none;
}

.orderContent {
  padding: 0 9px 9px;
}

.orderGrid {
  display: grid;
  grid-template-columns: 55px 1fr auto;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}

.orderGrid input {
  width: 100%;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 7px;
  background: white;
}

.badge {
  border-radius: 999px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.expired {
  background: #ffdada;
  color: #a40000;
}

.today {
  background: #ffe8b3;
  color: #865700;
}

.tomorrow {
  background: #fff3c7;
  color: #755800;
}

.safe {
  background: #dff6e5;
  color: #12692d;
}

.none {
  background: #e5e5ea;
  color: #666;
}

/* Todo */

.todo {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.todoMain {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

.todoMain input[type="checkbox"] {
  width: 20px;
  height: 20px;
}

.todoText {
  flex: 1;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.done {
  text-decoration: line-through;
  color: #999;
}

.todoMeta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 5px 0 0 28px;
}

.tag {
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}

.high {
  background: #ffdada;
  color: #a00000;
}

.normal {
  background: #e5e5ea;
}

.low {
  background: #e8f3ff;
  color: #1467a5;
}

.dateTag {
  background: #eeeafc;
  color: #51409a;
}

.overdueTag {
  background: #ffdada;
  color: #a00000;
}

.todoEntry {
  display: grid;
  grid-template-columns: 1fr 92px 140px auto;
  gap: 5px;
  margin-top: 10px;
}

.todoEntry input,
.todoEntry select {
  width: 100%;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 8px;
  background: white;
}

.empty {
  text-align: center;
  color: #888;
  margin-top: 50px;
}

/* Calendar */

.calendarHeader {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.calendarTitle {
  text-align: center;
  font-size: 20px;
  font-weight: 800;
}

.weekHeader {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}

.weekHeader div {
  text-align: center;
  font-size: 12px;
  color: #666;
  font-weight: 700;
}

.calendarGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.dayCell {
  min-height: 105px;
  background: white;
  border-radius: 8px;
  padding: 5px;
  overflow: hidden;
}

.dayCell.otherMonth {
  opacity: .32;
}

.dayCell.todayCell {
  outline: 2px solid #007aff;
}

.dayNumber {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 4px;
}

.calTodo {
  border-radius: 5px;
  padding: 3px 4px;
  margin-bottom: 3px;
  font-size: 10px;
  line-height: 1.25;
  background: #e8f3ff;
  overflow: hidden;
  cursor: pointer;
}

.calTodo.priorityHigh {
  background: #ffdada;
}

.calTodo.completed {
  opacity: .45;
  text-decoration: line-through;
}

.calPatient {
  font-weight: 800;
}

.moreLabel {
  font-size: 10px;
  color: #666;
  font-weight: 700;
}

.undatedBox {
  background: white;
  border-radius: 13px;
  padding: 10px;
  margin-top: 12px;
}

.undatedTitle {
  font-weight: 800;
  margin-bottom: 7px;
}

.undatedItem {
  padding: 7px 3px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

#calendarView {
  display: none;
}

@media(max-width: 550px) {

  .todoEntry {
    grid-template-columns: 1fr 1fr;
  }

  .todoEntry .todoTextInput {
    grid-column: 1 / 3;
  }

  .todoEntry .dateInput {
    grid-column: 1;
  }

  .todoEntry button {
    grid-column: 2;
  }

  .dayCell {
    min-height: 88px;
    padding: 4px 3px;
  }

  .calTodo {
    font-size: 9px;
    padding: 3px;
  }
}
</style>
</head>

<body>

<header>

  <div class="headerTop">

    <h1>病棟 ToDo</h1>

    <button
      class="blue"
      onclick="addPatient()">
      ＋患者
    </button>

  </div>

  <div class="tabs">

    <button
      id="patientTabButton"
      class="tabButton active"
      onclick="showTab('patients')">
      患者一覧
    </button>

    <button
      id="calendarTabButton"
      class="tabButton"
      onclick="showTab('calendar')">
      カレンダー
    </button>

  </div>

</header>

<main>

<!-- 患者一覧 -->

<section id="patientView">

  <div class="toolbar">

    <button
      class="gray"
      onclick="deleteCompletedTodos()">
      ✓ 完了ToDo削除
    </button>

    <button
      class="red"
      onclick="deleteFinishedPatients()">
      完了患者一括削除
    </button>

  </div>

  <div class="toolbar">

    <button
      class="gray"
      onclick="backupData()">
      バックアップ保存
    </button>

    <button
      class="gray"
      onclick="document.getElementById('restoreFile').click()">
      バックアップ復元
    </button>

    <input
      id="restoreFile"
      type="file"
      accept=".json,application/json"
      style="display:none"
    >

  </div>

  <div id="patients"></div>

  <div
    id="empty"
    class="empty">
    ＋患者 から追加してください
  </div>

</section>

<!-- カレンダー -->

<section id="calendarView">

  <div class="calendarHeader">

    <button
      class="gray"
      onclick="changeMonth(-1)">
      ‹
    </button>

    <div
      id="calendarTitle"
      class="calendarTitle">
    </div>

    <button
      class="gray"
      onclick="changeMonth(1)">
      ›
    </button>

  </div>

  <div class="toolbar">

    <button
      class="gray"
      onclick="goToday()">
      今月
    </button>

  </div>

  <div class="weekHeader">

    <div>日</div>
    <div>月</div>
    <div>火</div>
    <div>水</div>
    <div>木</div>
    <div>金</div>
    <div>土</div>

  </div>

  <div
    id="calendarGrid"
    class="calendarGrid">
  </div>

  <div
    id="undatedBox"
    class="undatedBox">

    <div class="undatedTitle">
      日付未設定ToDo
    </div>

    <div id="undatedList"></div>

  </div>

</section>

</main>

<script>

/* ================================
   保存
================================ */

const KEY = "hospiTodo";

function uid() {
  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,8)
  );
}

function formatDateLocal(date) {

  const y = date.getFullYear();

  const m =
    String(date.getMonth()+1)
    .padStart(2,"0");

  const d =
    String(date.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function todayString() {
  return formatDateLocal(new Date());
}

function tomorrowString() {

  const d = new Date();

  d.setDate(
    d.getDate() + 1
  );

  return formatDateLocal(d);
}

let patients = [];

try {

  patients =
    JSON.parse(
      localStorage.getItem(KEY)
    ) || [];

} catch(e) {

  patients = [];
}

/* ================================
   旧データ → 新形式
================================ */

patients =
  patients.map(p => {

    const defaultOrders = {
      blood: "",
      drip: "",
      procedure: "",
      prescription: ""
    };

    const orders = {
      ...defaultOrders,
      ...(p.orders || {})
    };

    const todos =
      (p.todos || []).map(t => {

        let dueDate =
          t.dueDate || "";

        /*
        旧版
        today / tomorrow / later
        を日付形式へ自動移行
        */

        if(!dueDate) {

          if(t.timing === "today") {

            dueDate =
              todayString();

          } else if(
            t.timing === "tomorrow"
          ) {

            dueDate =
              tomorrowString();

          }
        }

        return {

          id:
            String(
              t.id || uid()
            ),

          text:
            t.text || "",

          done:
            !!t.done,

          priority:
            t.priority || "normal",

          dueDate:
            dueDate
        };
      });

    return {

      id:
        String(
          p.id || uid()
        ),

      room:
        p.room || "",

      initial:
        p.initial || "",

      finished:
        !!p.finished,

      orders:
        orders,

      todos:
        todos
    };
  });

save();


function save() {

  localStorage.setItem(
    KEY,
    JSON.stringify(patients)
  );
}


/* ================================
   タブ
================================ */

function showTab(tab) {

  const patientView =
    document.getElementById(
      "patientView"
    );

  const calendarView =
    document.getElementById(
      "calendarView"
    );

  const patientButton =
    document.getElementById(
      "patientTabButton"
    );

  const calendarButton =
    document.getElementById(
      "calendarTabButton"
    );

  if(tab === "calendar") {

    patientView.style.display =
      "none";

    calendarView.style.display =
      "block";

    patientButton.classList
      .remove("active");

    calendarButton.classList
      .add("active");

    renderCalendar();

  } else {

    patientView.style.display =
      "block";

    calendarView.style.display =
      "none";

    calendarButton.classList
      .remove("active");

    patientButton.classList
      .add("active");

    render();
  }
}


/* ================================
   患者
================================ */

function addPatient() {

  patients.push({

    id: uid(),

    room: "",

    initial: "",

    finished: false,

    orders: {
      blood: "",
      drip: "",
      procedure: "",
      prescription: ""
    },

    todos: []
  });

  save();

  showTab("patients");

  setTimeout(() => {

    const cards =
      document.querySelectorAll(
        ".card"
      );

    const last =
      cards[cards.length-1];

    last?.scrollIntoView({
      behavior: "smooth"
    });

  },50);
}


function deletePatient(id) {

  if(
    !confirm(
      "この患者を削除しますか？"
    )
  ) return;

  patients =
    patients.filter(
      p => p.id !== id
    );

  save();
  render();
}


function movePatient(id,dir) {

  const i =
    patients.findIndex(
      p => p.id === id
    );

  const j =
    i + dir;

  if(
    i < 0 ||
    j < 0 ||
    j >= patients.length
  ) return;

  [
    patients[i],
    patients[j]
  ] = [
    patients[j],
    patients[i]
  ];

  save();
  render();
}


function updatePatient(
  id,
  key,
  value
) {

  const p =
    patients.find(
      p => p.id === id
    );

  if(!p) return;

  p[key] = value;

  save();
}


function toggleFinished(id) {

  const p =
    patients.find(
      p => p.id === id
    );

  if(!p) return;

  p.finished =
    !p.finished;

  save();
  render();
}


function updateOrder(
  id,
  type,
  value
) {

  const p =
    patients.find(
      p => p.id === id
    );

  if(!p) return;

  p.orders[type] =
    value;

  save();
  render();
}


/* ================================
   Todo
================================ */

function addTodo(id) {

  const textEl =
    document.getElementById(
      "text-" + id
    );

  const priorityEl =
    document.getElementById(
      "priority-" + id
    );

  const dateEl =
    document.getElementById(
      "date-" + id
    );

  const text =
    textEl.value.trim();

  if(!text) return;

  const p =
    patients.find(
      p => p.id === id
    );

  if(!p) return;

  p.todos.push({

    id: uid(),

    text:
      text,

    done:
      false,

    priority:
      priorityEl.value,

    dueDate:
      dateEl.value
  });

  save();
  render();
}


function toggleTodo(
  patientId,
  todoId
) {

  const p =
    patients.find(
      p => p.id === patientId
    );

  if(!p) return;

  const t =
    p.todos.find(
      t => t.id === todoId
    );

  if(!t) return;

  t.done =
    !t.done;

  save();
  render();
  renderCalendar();
}


function deleteTodo(
  patientId,
  todoId
) {

  const p =
    patients.find(
      p => p.id === patientId
    );

  if(!p) return;

  p.todos =
    p.todos.filter(
      t => t.id !== todoId
    );

  save();
  render();
}


function deleteCompletedTodos() {

  const count =
    patients.reduce(
      (n,p) =>
        n +
        p.todos.filter(
          t => t.done
        ).length,
      0
    );

  if(!count) {

    alert(
      "完了済みToDoはありません"
    );

    return;
  }

  if(
    !confirm(
      "完了済みToDo " +
      count +
      "件を削除しますか？"
    )
  ) return;

  patients.forEach(p => {

    p.todos =
      p.todos.filter(
        t => !t.done
      );

  });

  save();
  render();
}


function deleteFinishedPatients() {

  const count =
    patients.filter(
      p => p.finished
    ).length;

  if(!count) {

    alert(
      "完了患者はいません"
    );

    return;
  }

  if(
    !confirm(
      "完了患者 " +
      count +
      "名を削除しますか？"
    )
  ) return;

  patients =
    patients.filter(
      p => !p.finished
    );

  save();
  render();
}


/* ================================
   日付表示
================================ */

function dateStatus(dateStr) {

  if(!dateStr) {

    return {
      text: "未入力",
      cls: "none"
    };
  }

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const d =
    new Date(
      dateStr +
      "T00:00:00"
    );

  const diff =
    Math.round(
      (d - today) /
      86400000
    );

  if(diff < 0) {

    return {
      text: "期限切れ",
      cls: "expired"
    };
  }

  if(diff === 0) {

    return {
      text: "今日まで",
      cls: "today"
    };
  }

  if(diff === 1) {

    return {
      text: "明日まで",
      cls: "tomorrow"
    };
  }

  return {
    text:
      diff +
      "日先まで",

    cls:
      "safe"
  };
}


function todoDateText(
  dateStr,
  done
) {

  if(!dateStr) {

    return {
      text:
        "日付未設定",

      cls:
        "dateTag"
    };
  }

  const today =
    todayString();

  const tomorrow =
    tomorrowString();

  if(
    dateStr === today
  ) {

    return {
      text: "今日",
      cls: "dateTag"
    };
  }

  if(
    dateStr === tomorrow
  ) {

    return {
      text: "明日",
      cls: "dateTag"
    };
  }

  if(
    dateStr < today &&
    !done
  ) {

    return {
      text:
        "期限超過 " +
        displayDate(dateStr),

      cls:
        "overdueTag"
    };
  }

  return {
    text:
      displayDate(dateStr),

    cls:
      "dateTag"
  };
}


function displayDate(s) {

  if(!s) return "";

  const parts =
    s.split("-");

  if(parts.length !== 3)
    return s;

  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );
}


function priorityText(v) {

  if(v === "high")
    return "高";

  if(v === "low")
    return "低";

  return "通常";
}


/* ================================
   バックアップ
================================ */

async function backupData() {

  const backup = {

    app:
      "Hospi Todo",

    version:
      3,

    exportedAt:
      new Date()
      .toISOString(),

    patients:
      patients
  };

  const json =
    JSON.stringify(
      backup,
      null,
      2
    );

  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );

  const now =
    new Date();

  const date =
    formatDateLocal(now);

  const time =
    String(
      now.getHours()
    ).padStart(2,"0") +
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const filename =
    "hospi-todo-backup-" +
    date +
    "-" +
    time +
    ".json";

  const file =
    new File(
      [blob],
      filename,
      {
        type:
          "application/json"
      }
    );

  if(
    navigator.canShare &&
    navigator.canShare({
      files: [file]
    })
  ) {

    try {

      await navigator.share({
        files: [file],
        title:
          "病棟ToDoバックアップ"
      });

      return;

    } catch(e) {

      if(
        e.name ===
        "AbortError"
      ) return;
    }
  }

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body
    .appendChild(a);

  a.click();

  a.remove();

  setTimeout(() => {

    URL.revokeObjectURL(
      url
    );

  },1000);
}


/* ================================
   復元
================================ */

document
.getElementById(
  "restoreFile"
)
.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload =
      function() {

      try {

        const backup =
          JSON.parse(
            reader.result
          );

        if(
          !backup ||
          !Array.isArray(
            backup.patients
          )
        ) {

          alert(
            "バックアップファイルの形式が正しくありません"
          );

          return;
        }

        if(
          !confirm(
            "現在のデータをバックアップ内容で上書きしますか？"
          )
        ) return;

        patients =
          backup.patients;

        /*
        復元データにも
        正規化処理をかける
        */

        patients =
          patients.map(p => ({

            id:
              String(
                p.id || uid()
              ),

            room:
              p.room || "",

            initial:
              p.initial || "",

            finished:
              !!p.finished,

            orders: {
              blood:
                p.orders?.blood || "",

              drip:
                p.orders?.drip || "",

              procedure:
                p.orders?.procedure || "",

              prescription:
                p.orders?.prescription || ""
            },

            todos:
              (p.todos || [])
              .map(t => ({

                id:
                  String(
                    t.id || uid()
                  ),

                text:
                  t.text || "",

                done:
                  !!t.done,

                priority:
                  t.priority ||
                  "normal",

                dueDate:
                  t.dueDate ||
                  ""
              }))
          }));

        save();

        render();

        renderCalendar();

        alert(
          "バックアップを復元しました"
        );

      } catch(e) {

        alert(
          "バックアップファイルを読み込めませんでした"
        );
      }

      event.target.value =
        "";
    };

    reader.readAsText(
      file
    );
  }
);


/* ================================
   HTML Escape
================================ */

function escapeHTML(str) {

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ================================
   患者一覧表示
================================ */

function render() {

  const container =
    document.getElementById(
      "patients"
    );

  container.innerHTML =
    "";

  document.getElementById(
    "empty"
  ).style.display =
    patients.length
      ? "none"
      : "block";

  patients.forEach(
    (p,index) => {

    const card =
      document.createElement(
        "div"
      );

    card.id =
      "patient-" +
      p.id;

    card.className =
      "card" +
      (
        p.finished
          ? " finished"
          : ""
      );

    const orderLabels = [

      ["blood","採血"],

      ["drip","点滴"],

      ["procedure","処置"],

      ["prescription","処方"]

    ];

    let ordersHTML =
      "";

    orderLabels.forEach(
      ([key,label]) => {

      const status =
        dateStatus(
          p.orders[key]
        );

      ordersHTML += `
        <div class="orderGrid">

          <div>
            ${label}
          </div>

          <input
            type="date"
            value="${p.orders[key] || ""}"
            onchange="
              updateOrder(
                '${p.id}',
                '${key}',
                this.value
              )
            "
          >

          <span
            class="
              badge
              ${status.cls}
            "
          >
            ${status.text}
          </span>

        </div>
      `;
    });


    let todosHTML =
      "";

    p.todos.forEach(t => {

      const dateInfo =
        todoDateText(
          t.dueDate,
          t.done
        );

      todosHTML += `
        <div class="todo">

          <div class="todoMain">

            <input
              type="checkbox"
              ${t.done ? "checked" : ""}
              onchange="
                toggleTodo(
                  '${p.id}',
                  '${t.id}'
                )
              "
            >

            <div
              class="
                todoText
                ${t.done ? "done" : ""}
              "
            >
              ${escapeHTML(t.text)}
            </div>

            <button
              class="red"
              onclick="
                deleteTodo(
                  '${p.id}',
                  '${t.id}'
                )
              "
            >
              ×
            </button>

          </div>

          <div class="todoMeta">

            <span
              class="
                tag
                ${t.priority}
              "
            >
              ${priorityText(
                t.priority
              )}
            </span>

            <span
              class="
                tag
                ${dateInfo.cls}
              "
            >
              ${dateInfo.text}
            </span>

          </div>

        </div>
      `;
    });


    card.innerHTML = `

      <div class="patientTop">

        <input
          class="room"
          placeholder="部屋"
          value="${escapeHTML(p.room)}"
          oninput="
            updatePatient(
              '${p.id}',
              'room',
              this.value
            )
          "
        >

        <input
          class="initial"
          placeholder="イニシャル"
          maxlength="8"
          value="${escapeHTML(p.initial)}"
          oninput="
            updatePatient(
              '${p.id}',
              'initial',
              this.value.toUpperCase()
            )
          "
        >

        <div class="moveRow">

          <button
            class="gray"
            onclick="
              movePatient(
                '${p.id}',
                -1
              )
            "
            ${index === 0
              ? "disabled"
              : ""}
          >
            ↑
          </button>

          <button
            class="gray"
            onclick="
              movePatient(
                '${p.id}',
                1
              )
            "
            ${
              index ===
              patients.length-1
                ? "disabled"
                : ""
            }
          >
            ↓
          </button>

        </div>

      </div>


      <div class="statusRow">

        <button
          class="
            ${p.finished
              ? "green"
              : "gray"}
          "
          onclick="
            toggleFinished(
              '${p.id}'
            )
          "
        >
          ${
            p.finished
              ? "✓ 患者完了"
              : "患者完了"
          }
        </button>

        <button
          class="red"
          onclick="
            deletePatient(
              '${p.id}'
            )
          "
        >
          患者削除
        </button>

      </div>


      <details class="orderDetails">

        <summary>
          オーダー確認
        </summary>

        <div class="orderContent">

          ${ordersHTML}

        </div>

      </details>


      ${todosHTML}


      <div class="todoEntry">

        <input
          id="text-${p.id}"
          class="todoTextInput"
          placeholder="ToDo"
          onkeydown="
            if(
              event.key ===
              'Enter'
            ){
              addTodo('${p.id}')
            }
          "
        >

        <select
          id="priority-${p.id}"
        >

          <option value="high">
            高
          </option>

          <option
            value="normal"
            selected
          >
            通常
          </option>

          <option value="low">
            低
          </option>

        </select>


        <input
          id="date-${p.id}"
          class="dateInput"
          type="date"
          value="${todayString()}"
        >


        <button
          class="blue"
          onclick="
            addTodo(
              '${p.id}'
            )
          "
        >
          追加
        </button>

      </div>
    `;

    container
      .appendChild(card);
  });
}


/* ================================
   Calendar
================================ */

const now =
  new Date();

let calendarYear =
  now.getFullYear();

let calendarMonth =
  now.getMonth();


function changeMonth(diff) {

  calendarMonth +=
    diff;

  if(
    calendarMonth < 0
  ) {

    calendarMonth = 11;
    calendarYear--;

  } else if(
    calendarMonth > 11
  ) {

    calendarMonth = 0;
    calendarYear++;
  }

  renderCalendar();
}


function goToday() {

  const d =
    new Date();

  calendarYear =
    d.getFullYear();

  calendarMonth =
    d.getMonth();

  renderCalendar();
}


function openPatient(id) {

  showTab(
    "patients"
  );

  setTimeout(() => {

    const el =
      document.getElementById(
        "patient-" +
        id
      );

    if(!el) return;

    el.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    el.style.outline =
      "3px solid #007aff";

    setTimeout(() => {

      el.style.outline =
        "";

    },1200);

  },50);
}


function renderCalendar() {

  const title =
    document.getElementById(
      "calendarTitle"
    );

  const grid =
    document.getElementById(
      "calendarGrid"
    );

  title.textContent =
    calendarYear +
    "年 " +
    (calendarMonth+1) +
    "月";

  grid.innerHTML =
    "";

  /*
  カレンダー先頭
  */

  const first =
    new Date(
      calendarYear,
      calendarMonth,
      1
    );

  const start =
    new Date(first);

  start.setDate(
    1 -
    first.getDay()
  );

  const today =
    todayString();

  /*
  6週間 = 42日
  */

  for(
    let i=0;
    i<42;
    i++
  ) {

    const d =
      new Date(start);

    d.setDate(
      start.getDate() +
      i
    );

    const dateStr =
      formatDateLocal(d);

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "dayCell";

    if(
      d.getMonth() !==
      calendarMonth
    ) {

      cell.classList.add(
        "otherMonth"
      );
    }

    if(
      dateStr ===
      today
    ) {

      cell.classList.add(
        "todayCell"
      );
    }

    const number =
      document.createElement(
        "div"
      );

    number.className =
      "dayNumber";

    number.textContent =
      d.getDate();

    cell.appendChild(
      number
    );

    const dayTodos =
      [];

    patients.forEach(p => {

      p.todos.forEach(t => {

        if(
          t.dueDate ===
          dateStr
        ) {

          dayTodos.push({
            patient: p,
            todo: t
          });
        }
      });
    });

    /*
    未完了を上に、
    優先度高をさらに上に
    */

    dayTodos.sort(
      (a,b) => {

      if(
        a.todo.done !==
        b.todo.done
      ) {

        return (
          a.todo.done
            ? 1
            : -1
        );
      }

      const rank = {
        high: 0,
        normal: 1,
        low: 2
      };

      return (
        rank[
          a.todo.priority
        ] -
        rank[
          b.todo.priority
        ]
      );
    });

    const maxShow =
      3;

    dayTodos
      .slice(0,maxShow)
      .forEach(item => {

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "calTodo";

      if(
        item.todo.priority ===
        "high"
      ) {

        el.classList.add(
          "priorityHigh"
        );
      }

      if(
        item.todo.done
      ) {

        el.classList.add(
          "completed"
        );
      }

      const patientName =
        (
          item.patient.room
            ? item.patient.room + " "
            : ""
        ) +
        (
          item.patient.initial ||
          "?"
        );

      el.innerHTML =
        `<span class="calPatient">` +
        escapeHTML(patientName) +
        `</span> ` +
        escapeHTML(
          item.todo.text
        );

      el.onclick =
        () =>
          openPatient(
            item.patient.id
          );

      cell.appendChild(
        el
      );
    });

    if(
      dayTodos.length >
      maxShow
    ) {

      const more =
        document.createElement(
          "div"
        );

      more.className =
        "moreLabel";

      more.textContent =
        "+" +
        (
          dayTodos.length -
          maxShow
        ) +
        "件";

      cell.appendChild(
        more
      );
    }

    grid.appendChild(
      cell
    );
  }

  renderUndated();
}


function renderUndated() {

  const list =
    document.getElementById(
      "undatedList"
    );

  const box =
    document.getElementById(
      "undatedBox"
    );

  list.innerHTML =
    "";

  const items =
    [];

  patients.forEach(p => {

    p.todos.forEach(t => {

      if(
        !t.dueDate
      ) {

        items.push({
          patient: p,
          todo: t
        });
      }
    });
  });

  if(
    !items.length
  ) {

    box.style.display =
      "none";

    return;
  }

  box.style.display =
    "block";

  items.forEach(item => {

    const el =
      document.createElement(
        "div"
      );

    el.className =
      "undatedItem";

    const patientName =
      (
        item.patient.room
          ? item.patient.room + " "
          : ""
      ) +
      (
        item.patient.initial ||
        "?"
      );

    el.innerHTML =
      `<b>${escapeHTML(patientName)}</b> ` +
      escapeHTML(
        item.todo.text
      );

    el.onclick =
      () =>
        openPatient(
          item.patient.id
        );

    list.appendChild(
      el
    );
  });
}


/* ================================
   起動
================================ */

render();

renderCalendar();

</script>
