<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="病棟ToDo">
<title>病棟ToDo v1.09</title>

<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{margin:0;background:#f2f2f7;color:#111}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:8px 10px;font-weight:650}
button:active{opacity:.65}

header{
 position:sticky;top:0;z-index:30;
 background:rgba(255,255,255,.97);
 border-bottom:1px solid #ddd;
 padding-top:env(safe-area-inset-top)
}
.headerTop{
 display:flex;justify-content:space-between;align-items:center;
 padding:11px 12px 8px
}
h1{margin:0;font-size:21px}

.tabs{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;padding:0 7px 8px
}
.tabButton{
 background:#e5e5ea;
 font-size:12px;
 padding:9px 2px
}
.tabButton.active{
 background:#007aff;
 color:white
}

main{
 max-width:850px;
 margin:auto;
 padding:12px;
 padding-bottom:calc(45px + env(safe-area-inset-bottom))
}

.blue{background:#007aff;color:white}
.gray{background:#e5e5ea;color:#111}
.red{background:#ffe1e1;color:#a50000}
.green{background:#dff5e5;color:#126e2e}
.orange{background:#fff0c9;color:#805600}

.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-bottom:10px
}

.card{
 background:white;
 border-radius:15px;
 padding:12px;
 margin-bottom:12px;
 box-shadow:0 1px 4px rgba(0,0,0,.08)
}
.card.finished{opacity:.55}

.sectionTitle{
 font-size:18px;
 font-weight:800;
 margin-bottom:4px
}
.smallText{
 font-size:12px;
 color:#666
}
.empty{
 text-align:center;
 color:#888;
 padding:50px 10px
}

.patientTop{
 display:grid;
 grid-template-columns:80px 1fr auto;
 gap:7px;
 align-items:center
}

.room,.patientName{
 width:100%;
 min-width:0;
 border:1px solid #ccc;
 border-radius:9px;
 padding:9px;
 background:white;
 font-size:16px
}
.patientName{font-weight:700}

.moveButtons{
 display:flex;
 gap:3px
}
.moveButtons button{
 padding:7px 8px
}

.quickMemo{
 width:100%;
 min-height:42px;
 max-height:110px;
 margin-top:8px;
 border:1px solid #d3d3d8;
 border-radius:9px;
 padding:8px 9px;
 background:#fafafa;
 font-size:13px;
 line-height:1.35;
 resize:vertical
}

.statusRow{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:9px
}

.detailsBox,.todoDetails{
 background:#f7f7f9;
 border-radius:11px;
 margin-top:10px;
 overflow:hidden
}

.detailsBox summary,
.todoDetails summary{
 cursor:pointer;
 padding:10px;
 font-size:14px;
 font-weight:800;
 user-select:none
}

.detailsContent,.todoContent{
 padding:0 9px 10px
}

.formRow{
 display:grid;
 grid-template-columns:76px 1fr auto;
 gap:6px;
 align-items:center;
 margin-bottom:8px
}

.formRow input,
.formRow select,
.formRow textarea{
 width:100%;
 min-width:0;
 border:1px solid #ccc;
 border-radius:8px;
 padding:8px;
 background:white
}

.formRow textarea{
 min-height:105px;
 line-height:1.45;
 resize:vertical
}

.dateAction{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
 align-items:center
}

.badge{
 display:inline-block;
 border-radius:999px;
 padding:4px 7px;
 font-size:11px;
 font-weight:750;
 white-space:nowrap
}

.expired{background:#ffd5d5;color:#a00000}
.today{background:#ffe59a;color:#765100}
.tomorrow{background:#fff1c5;color:#775800}
.safe{background:#dff5e5;color:#14682e}
.none,.noPlan{background:#e5e5ea;color:#666}

.alertRow{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:9px
}

.alert{
 padding:5px 8px;
 border-radius:7px;
 font-size:12px;
 font-weight:800
}

.alertRed{background:#ffd5d5;color:#a00000}
.alertYellow{background:#ffe59a;color:#765100}
.alertTomorrow{background:#fff1c5;color:#775800}

.wardAlertBox{
 background:white;
 border-radius:14px;
 margin-bottom:12px;
 overflow:hidden;
 box-shadow:0 1px 4px rgba(0,0,0,.08)
}

.wardAlertHeader{
 padding:11px 12px;
 font-size:15px;
 font-weight:800;
 border-bottom:1px solid #eee
}

.wardAlertSummary{
 padding:8px 12px;
 border-bottom:1px solid #eee;
 font-size:12px;
 color:#666
}

.wardAlertItem{
 display:grid;
 grid-template-columns:auto 1fr;
 gap:8px;
 align-items:center;
 padding:10px 12px;
 border-bottom:1px solid #eee
}

.wardAlertPatient{
 font-weight:800;
 font-size:13px
}
.wardAlertText{
 font-size:13px;
 margin-top:2px
}
.wardAlertNone{
 padding:11px 12px;
 color:#777;
 font-size:13px
}

.todo{
 padding:10px 0;
 border-bottom:1px solid #ddd
}

.todoMain{
 display:flex;
 gap:8px;
 align-items:flex-start
}

.todoMain input[type=checkbox]{
 width:21px;
 height:21px
}

.todoText{
 flex:1;
 font-size:16px;
 overflow-wrap:anywhere
}

.done{
 text-decoration:line-through;
 color:#999
}

.todoMeta{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin:5px 0 0 29px
}

.tag{
 padding:3px 7px;
 border-radius:6px;
 font-size:11px;
 font-weight:750
}

.high{background:#ffdada;color:#9d0000}
.normal{background:#e5e5ea}
.low{background:#e5f2ff;color:#14669f}
.dateTag{background:#eeeafd;color:#50409a}
.overdueTag{background:#ffdada;color:#a00000}

.todoEntry{
 display:grid;
 grid-template-columns:1fr 90px 138px auto;
 gap:5px;
 margin-top:10px
}

.todoEntry input,
.todoEntry select{
 width:100%;
 min-width:0;
 border:1px solid #ccc;
 border-radius:8px;
 padding:8px;
 background:white
}

.subTabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-bottom:12px
}
.subTab{background:#e5e5ea}
.subTab.active{
 background:#007aff;
 color:white
}

.bloodPatientRow{
 display:grid;
 grid-template-columns:auto 1fr auto;
 gap:10px;
 align-items:center;
 padding:11px 4px;
 border-bottom:1px solid #eee
}

.bloodPatientRow input{
 width:22px;
 height:22px
}

.bloodPatientName{
 font-weight:700
}

.registeredBadge{
 background:#dff5e5;
 color:#157232;
 border-radius:999px;
 padding:4px 8px;
 font-size:11px;
 font-weight:750
}

.calendarHeader{
 display:grid;
 grid-template-columns:auto 1fr auto;
 gap:8px;
 align-items:center;
 margin-bottom:10px
}

.calendarTitle{
 text-align:center;
 font-size:20px;
 font-weight:800
}

.weekHeader,.calendarGrid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:3px;
 align-items:start
}

.weekHeader div{
 text-align:center;
 font-size:12px;
 color:#666;
 font-weight:700
}

.dayCell{
 min-height:100px;
 background:white;
 border-radius:8px;
 padding:5px;
 overflow:visible
}

.dayCell.otherMonth{opacity:.32}
.dayCell.todayCell{
 outline:2px solid #007aff
}

.dayNumber{
 font-size:12px;
 font-weight:800;
 margin-bottom:4px
}

.calTodo{
 border-radius:5px;
 padding:4px;
 margin-bottom:3px;
 font-size:10px;
 line-height:1.25;
 background:#ffdada;
 white-space:normal;
 overflow-wrap:anywhere;
 word-break:break-word
}

.calTodo.completed{
 opacity:.45;
 text-decoration:line-through
}

.handoffOverlay{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#f2f2f7;
 overflow:auto;
 padding-top:env(safe-area-inset-top)
}

.handoffHeader{
 position:sticky;
 top:0;
 z-index:2;
 background:white;
 border-bottom:1px solid #ddd;
 padding:10px
}

.handoffBody{
 max-width:850px;
 margin:auto;
 padding:12px 12px 45px
}

.handoffTextarea{
 width:100%;
 min-height:75vh;
 border:1px solid #bbb;
 border-radius:12px;
 padding:12px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:14px;
 line-height:1.5;
 resize:vertical
}

#outpatientView,#bloodView,#calendarView{
 display:none
}

@media(max-width:550px){
 .patientTop{
  grid-template-columns:75px 1fr auto
 }
 .moveButtons{
  flex-direction:column
 }
 .moveButtons button{
  padding:5px 7px
 }
 .todoEntry{
  grid-template-columns:1fr 1fr
 }
 .todoEntry .todoTextInput{
  grid-column:1/3
 }
 .formRow{
  grid-template-columns:70px 1fr
 }
 .formRow>.dateAction{
  grid-column:2
 }
 .dayCell{
  min-height:88px;
  padding:4px 3px
 }
 .calTodo{
  font-size:9px
 }
}
</style>
</head>

<body>

<header>
<div class="headerTop">
<h1>病棟 ToDo</h1>
<button class="blue" onclick="addPatientFromCurrentTab()">＋患者</button>
</div>

<div class="tabs">
<button id="wardTabButton" class="tabButton active"
 onclick="showTab('ward')">病棟患者</button>
<button id="outpatientTabButton" class="tabButton"
 onclick="showTab('outpatient')">外来患者</button>
<button id="bloodTabButton" class="tabButton"
 onclick="showTab('blood')">採血</button>
<button id="calendarTabButton" class="tabButton"
 onclick="showTab('calendar')">カレンダー</button>
</div>
</header>

<main>

<section id="wardView">

<div id="wardAlertContainer"></div>

<div class="toolbar">
<button class="gray" onclick="sortWardByRoom()">部屋順</button>
<button class="gray" onclick="sortWardByAdmission()">入院日順</button>
<button class="blue" onclick="openHandoff()">申し送り作成</button>
</div>

<div class="toolbar">
<button class="gray" onclick="deleteCompletedTodos()">完了ToDo削除</button>
<button class="red" onclick="deleteFinishedPatients()">完了患者削除</button>
<button class="gray" onclick="backupData()">バックアップ保存</button>
<button class="gray" onclick="document.getElementById('restoreFile').click()">復元</button>

<input id="restoreFile"
 type="file"
 accept=".json,application/json"
 style="display:none">
</div>

<div id="wardPatients"></div>
<div id="wardEmpty" class="empty">
＋患者 から追加してください
</div>

</section>


<section id="outpatientView">

<div class="toolbar">
<button class="gray" onclick="backupData()">バックアップ保存</button>
</div>

<div id="outpatientPatients"></div>

<div id="outpatientEmpty" class="empty">
外来患者はいません
</div>

</section>


<section id="bloodView">

<div class="card">

<div class="sectionTitle">今日の採血</div>

<div class="smallText" style="margin-bottom:12px">
入院・外来を切り替えて患者を選択できます。
</div>

<div class="subTabs">

<button id="bloodWardButton"
 class="subTab active"
 onclick="switchBloodGroup('ward')">
入院
</button>

<button id="bloodOutpatientButton"
 class="subTab"
 onclick="switchBloodGroup('outpatient')">
外来
</button>

</div>

<div class="toolbar">
<button class="gray" onclick="selectAllBlood()">全選択</button>
<button class="gray" onclick="clearAllBlood()">全解除</button>
</div>

<div id="bloodPatientList"></div>

<button class="blue"
 style="width:100%;margin-top:12px;padding:11px"
 onclick="addBloodTodos()">
選択患者に採血ToDoを追加
</button>

</div>

</section>


<section id="calendarView">

<div class="calendarHeader">

<button class="gray" onclick="changeMonth(-1)">‹</button>

<div id="calendarTitle" class="calendarTitle"></div>

<button class="gray" onclick="changeMonth(1)">›</button>

</div>

<div class="toolbar">
<button class="gray" onclick="goToday()">今月</button>
</div>

<div class="smallText" style="margin-bottom:10px">
優先度「高」のToDoを全件表示
</div>

<div class="weekHeader">
<div>日</div>
<div>月</div>
<div>火</div>
<div>水</div>
<div>木</div>
<div>金</div>
<div>土</div>
</div>

<div id="calendarGrid" class="calendarGrid"></div>

</section>

</main>


<div id="handoffOverlay" class="handoffOverlay">

<div class="handoffHeader">

<div class="toolbar" style="margin:0">
<button class="gray" onclick="closeHandoff()">← 戻る</button>
<button class="blue" onclick="generateHandoff()">再生成</button>
<button class="green" onclick="copyHandoff()">全文コピー</button>
</div>

</div>

<div class="handoffBody">
<textarea id="handoffText" class="handoffTextarea"></textarea>
</div>

</div>


<script>

const KEY="hospiTodo";

let activeMainTab="ward";
let bloodGroup="ward";

/*
 v8.1:
 患者ごとの折りたたみ状態を保持する。
 localStorageには保存せず、
 アプリを開いている間だけ保持。
*/
const openDetails=new Set();


function uid(){
 return Date.now().toString(36)+
 Math.random().toString(36).slice(2,8);
}


function formatDateLocal(date){

 const y=date.getFullYear();

 const m=
  String(date.getMonth()+1)
  .padStart(2,"0");

 const d=
  String(date.getDate())
  .padStart(2,"0");

 return `${y}-${m}-${d}`;

}


function todayString(){
 return formatDateLocal(new Date());
}


function tomorrowString(){

 const d=new Date();

 d.setDate(d.getDate()+1);

 return formatDateLocal(d);

}


function displayDate(s){

 if(!s)return "";

 const p=s.split("-");

 return p.length===3
 ?`${Number(p[1])}/${Number(p[2])}`
 :s;

}


function defaultDateState(){
 return {
  date:"",
  noPlan:false
 };
}


function normalizeDateState(v){

 if(typeof v==="string"){

  return {
   date:v,
   noPlan:false
  };

 }

 return {
  date:v?.date||"",
  noPlan:!!v?.noPlan
 };

}


let patients=[];

try{

 patients=
  JSON.parse(
   localStorage.getItem(KEY)
  )||[];

}catch(e){

 patients=[];

}


function normalizePatients(data){

 return (data||[]).map(p=>{

  const o=p.orders||{};

  return {

   id:String(p.id||uid()),

   location:
    p.location==="outpatient"
    ?"outpatient"
    :"ward",

   room:p.room||"",
   initial:p.initial||"",
   memo:p.memo||"",

   finished:!!p.finished,

   admissionDate:p.admissionDate||"",
   dischargeDate:p.dischargeDate||"",

   plannedAdmission:
    normalizeDateState(
     p.plannedAdmission||
     p.admissionPlan
    ),

   plannedAdmissionRoom:
    p.plannedAdmissionRoom||"",

   plannedDischarge:
    normalizeDateState(
     p.plannedDischarge||
     p.dischargePlan
    ),

   orders:{

    blood:
     normalizeDateState(o.blood),

    drip:
     normalizeDateState(o.drip),

    procedure:
     normalizeDateState(o.procedure),

    prescription:
     normalizeDateState(o.prescription)

   },

   todos:
    (p.todos||[]).map(t=>{

     let due=t.dueDate||"";

     if(
      !due &&
      t.timing==="today"
     ){
      due=todayString();
     }

     if(
      !due &&
      t.timing==="tomorrow"
     ){
      due=tomorrowString();
     }

     return {

      id:String(t.id||uid()),

      text:t.text||"",

      done:!!t.done,

      priority:
       t.priority||"normal",

      dueDate:due

     };

    }),

   handoff:{

    regimen:
     p.handoff?.regimen||
     p.regimen||
     "",

    mood:
     p.handoff?.mood||"",

    note:
     p.handoff?.note||"",

    category:
     p.handoff?.category==="consult"
     ?"consult"
     :"ward"

   }

  };

 });

}


patients=
 normalizePatients(patients);

save();


function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(patients)
 );

}


function escapeHTML(s){

 return String(s??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ---------- 折りたたみ状態 ---------- */

function detailKey(pid,type){

 return `${pid}:${type}`;

}


function detailsOpenAttr(pid,type){

 return openDetails.has(
  detailKey(pid,type)
 )
 ?" open"
 :"";

}


function detailToggle(el,pid,type){

 const key=
  detailKey(pid,type);

 if(el.open){

  openDetails.add(key);

 }else{

  openDetails.delete(key);

 }

}


/* ---------- タブ ---------- */

function showTab(tab){

 activeMainTab=tab;

 const views={
  ward:"wardView",
  outpatient:"outpatientView",
  blood:"bloodView",
  calendar:"calendarView"
 };

 const buttons={
  ward:"wardTabButton",
  outpatient:"outpatientTabButton",
  blood:"bloodTabButton",
  calendar:"calendarTabButton"
 };

 Object.values(views)
  .forEach(id=>{

   document
    .getElementById(id)
    .style.display="none";

  });

 Object.values(buttons)
  .forEach(id=>{

   document
    .getElementById(id)
    .classList.remove("active");

  });

 document
  .getElementById(views[tab])
  .style.display="block";

 document
  .getElementById(buttons[tab])
  .classList.add("active");

 if(tab==="ward"){
  renderWard();
 }

 if(tab==="outpatient"){
  renderOutpatient();
 }

 if(tab==="blood"){
  renderBloodPatients();
 }

 if(tab==="calendar"){
  renderCalendar();
 }

}


/* ---------- 患者 ---------- */

function newPatient(location){

 return {

  id:uid(),

  location,

  room:"",
  initial:"",
  memo:"",

  finished:false,

  admissionDate:"",
  dischargeDate:"",

  plannedAdmission:
   defaultDateState(),

  plannedAdmissionRoom:"",

  plannedDischarge:
   defaultDateState(),

  orders:{

   blood:
    defaultDateState(),

   drip:
    defaultDateState(),

   procedure:
    defaultDateState(),

   prescription:
    defaultDateState()

  },

  todos:[],

  handoff:{

   regimen:"",
   mood:"",
   note:"",
   category:"ward"

  }

 };

}


function addPatientFromCurrentTab(){

 const location=
  activeMainTab==="outpatient"
  ?"outpatient"
  :"ward";

 patients.push(
  newPatient(location)
 );

 save();

 showTab(location);

}


function updatePatient(
 id,
 key,
 value
){

 const p=
  patients.find(
   x=>x.id===id
  );

 if(!p)return;

 p[key]=value;

 save();

}


function deletePatient(id){

 if(
  !confirm(
   "この患者を削除しますか？"
  )
 ){
  return;
 }

 patients=
  patients.filter(
   p=>p.id!==id
  );

 save();
 renderAll();

}


function toggleFinished(id){

 const p=
  patients.find(
   x=>x.id===id
  );

 if(!p)return;

 p.finished=
  !p.finished;

 save();
 renderWard();

}


function deleteFinishedPatients(){

 const n=
  patients.filter(
   p=>
    p.location==="ward" &&
    p.finished
  ).length;

 if(!n){

  alert(
   "完了患者はいません"
  );

  return;

 }

 if(
  !confirm(
   `完了患者 ${n}名を削除しますか？`
  )
 ){
  return;
 }

 patients=
  patients.filter(
   p=>!(
    p.location==="ward" &&
    p.finished
   )
  );

 save();
 renderWard();

}


function movePatient(
 id,
 direction
){

 const i=
  patients.findIndex(
   p=>p.id===id
  );

 if(i<0)return;

 const p=patients[i];

 let target=
  i+direction;

 while(
  target>=0 &&
  target<patients.length &&
  patients[target].location!==
   p.location
 ){
  target+=direction;
 }

 if(
  target<0 ||
  target>=patients.length
 ){
  return;
 }

 [
  patients[i],
  patients[target]
 ]=[
  patients[target],
  patients[i]
 ];

 save();

 if(p.location==="ward"){
  renderWard();
 }else{
  renderOutpatient();
 }

}


function moveToOutpatient(id){

 const p=
  patients.find(
   x=>x.id===id
  );

 if(!p)return;

 if(
  !confirm(
   "この患者を外来患者へ移動しますか？"
  )
 ){
  return;
 }

 p.location="outpatient";

 /*
  実退院日は従来どおり
  病棟→外来移動時に今日を記録
 */
 if(!p.dischargeDate){
  p.dischargeDate=
   todayString();
 }

 save();
 renderAll();

}


function moveToWard(id){

 const p=
  patients.find(
   x=>x.id===id
  );

 if(!p)return;

 if(
  !confirm(
   "この患者を病棟患者へ移動しますか？"
  )
 ){
  return;
 }

 p.location="ward";

 /*
  v8.1変更点

  外来→病棟へ移動しても
  admissionDateには
  今日の日付を自動入力しない。
 */

 /*
  予定病棟→実際の部屋番号への
  引き継ぎだけは維持。
 */
 if(
  !p.room &&
  p.plannedAdmissionRoom
 ){
  p.room=
   p.plannedAdmissionRoom;
 }

 save();
 renderAll();

}


/* ---------- ソート ---------- */

function roomSortValue(room){

 const text=
  String(room||"")
   .trim()
   .toUpperCase();

 if(!text){

  return {
   ward:"ZZZZ",
   number:99999,
   raw:""
  };

 }

 const m=
  text.match(/\d+/);

 return {

  ward:
   text
    .replace(
     /[-_.\s]*\d+.*/,
     ""
    )
    .trim(),

  number:
   m
   ?Number(m[0])
   :99999,

  raw:text

 };

}


function compareRooms(a,b){

 const A=
  roomSortValue(a.room);

 const B=
  roomSortValue(b.room);

 return (

  A.ward.localeCompare(
   B.ward,
   "ja",
   {numeric:true}
  )

  ||

  A.number-B.number

  ||

  A.raw.localeCompare(
   B.raw,
   "ja",
   {numeric:true}
  )

 );

}


function sortWardByRoom(){

 const ward=
  patients
   .filter(
    p=>p.location==="ward"
   )
   .sort(compareRooms);

 const outpatient=
  patients.filter(
   p=>
    p.location==="outpatient"
  );

 patients=[
  ...ward,
  ...outpatient
 ];

 save();
 renderWard();

}


function sortWardByAdmission(){

 const ward=
  patients
   .filter(
    p=>p.location==="ward"
   )
   .sort((a,b)=>{

    const A=
     a.admissionDate||
     "9999-12-31";

    const B=
     b.admissionDate||
     "9999-12-31";

    if(A!==B){

     return A.localeCompare(B);

    }

    return compareRooms(a,b);

   });

 const outpatient=
  patients.filter(
   p=>
    p.location==="outpatient"
  );

 patients=[
  ...ward,
  ...outpatient
 ];

 save();
 renderWard();

}

function dateStatus(state){

 state=
  normalizeDateState(state);

 if(state.noPlan){

  return {
   text:"予定なし",
   cls:"noPlan"
  };

 }

 if(!state.date){

  return {
   text:"未入力",
   cls:"none"
  };

 }

 const t=new Date();

 t.setHours(
  0,0,0,0
 );

 const d=
  new Date(
   state.date+
   "T00:00:00"
  );

 const diff=
  Math.round(
   (d-t)/86400000
  );

 if(diff<0){

  return {
   text:"期限切れ",
   cls:"expired"
  };

 }

 if(diff===0){

  return {
   text:"今日まで",
   cls:"today"
  };

 }

 if(diff===1){

  return {
   text:"明日まで",
   cls:"tomorrow"
  };

 }

 return {
  text:`${diff}日先まで`,
  cls:"safe"
 };

}

function getOrderAlerts(p){

 const alerts=[];

 orderDefinitions
  .forEach(
   ([key,label])=>{

    const state=
     p.orders?.[key];

    if(
     !state ||
     state.noPlan ||
     !state.date
    ){
     return;
    }

    const status=
     dateStatus(state);

    if(
     status.cls==="expired"
    ){

     alerts.push({

      level:"expired",

      icon:"🔴",

      text:
       `${label}オーダー 期限切れ`,

      css:"alertRed",

      rank:0

     });

    }else if(
     status.cls==="today"
    ){

     alerts.push({

      level:"today",

      icon:"🟡",

      text:
       `${label}オーダー 今日まで`,

      css:"alertYellow",

      rank:2

     });

    }else if(
     status.cls==="tomorrow"
    ){

     alerts.push({

      level:"tomorrow",

      icon:"🟠",

      text:
       `${label}オーダー 明日まで`,

      css:"alertTomorrow",

      rank:3

     });

    }

   }
  );

 return alerts;

}


function getOverdueTodoAlerts(p){

/* ---------- 申し送り生成 ---------- */

function handoffPatientHeader(p){

 let text=
  (
   p.room
   ?p.room+" "
   :""
  )
  +
  (
   p.initial||
   "名称未入力"
  );

 if(
  p.handoff.regimen
 ){
  text+=
   " "+
   p.handoff.regimen;
 }

 if(
  p.handoff.mood
 ){
  text+=
   p.handoff.mood;
 }

 return text.trim();

}


function generateHandoff(){

 const today=
  todayString();

 const admissions=
  patients.filter(
   p=>
    p.admissionDate===
     today
  );

 const discharges=
  patients.filter(
   p=>
    p.dischargeDate===
     today
  );

 const plannedAdmissions=
  patients
   .filter(
    p=>
     p.location===
      "outpatient"
     &&
     !p.plannedAdmission
       .noPlan
     &&
     p.plannedAdmission
       .date
   )
   .sort(
    (a,b)=>
     a.plannedAdmission
      .date
      .localeCompare(
       b.plannedAdmission
        .date
      )
   );

 const plannedDischarges=
  patients
   .filter(
    p=>
     p.location==="ward"
     &&
     !p.plannedDischarge
       .noPlan
     &&
     p.plannedDischarge
       .date
   )
   .sort(
    (a,b)=>
     a.plannedDischarge
      .date
      .localeCompare(
       b.plannedDischarge
        .date
      )
   );

 const wardMembers=
  patients
   .filter(
    p=>
     p.location==="ward"
     &&
     p.handoff.category===
      "ward"
   )
   .sort(compareRooms);

 const consultMembers=
  patients
   .filter(
    p=>
     p.location==="ward"
     &&
     p.handoff.category===
      "consult"
   )
   .sort(compareRooms);

 const lines=[
  "<申し送り>",
  ""
 ];

 function section(
  title,
  arr,
  formatter
 ){

  lines.push(title);

  if(arr.length){

   arr.forEach(x=>{

    lines.push(
     formatter(x)
    );

   });

  }else{

   lines.push("なし");

  }

  lines.push("");

 }


 section(
  "☆入院:",
  admissions.sort(
   compareRooms
  ),
  p=>
   handoffPatientHeader(p)
 );


 section(
  "☆退院:",
  discharges,
  p=>
   handoffPatientHeader(p)
 );


 section(
  "☆入院予定:",
  plannedAdmissions,
  p=>
   (
    `${displayDate(
     p.plannedAdmission
      .date
    )} `+
    `${p.plannedAdmissionRoom||""} `+
    `${p.initial||"名称未入力"} `+
    `${p.handoff.regimen||""}`
   )
   .replace(/\s+/g," ")
   .trim()
 );


 section(
  "☆退院予定:",
  plannedDischarges,
  p=>
   (
    `${displayDate(
     p.plannedDischarge
      .date
    )} `+
    `${p.room||""} `+
    `${p.initial||"名称未入力"}`
   )
   .replace(/\s+/g," ")
   .trim()
 );


 lines.push(
  "☆病棟メンバー"
 );

 if(
  wardMembers.length
 ){

  wardMembers
   .forEach(p=>{

    lines.push(
     handoffPatientHeader(p)
    );

    if(
     p.handoff.note
    ){

     lines.push(
      p.handoff.note.trim()
     );

    }

    lines.push("");

   });

 }else{

  lines.push(
   "なし",
   ""
  );

 }


 lines.push("☆兼科");

 if(
  consultMembers.length
 ){

  consultMembers
   .forEach(p=>{

    lines.push(
     handoffPatientHeader(p)
    );

    if(
     p.handoff.note
    ){

     lines.push(
      p.handoff.note.trim()
     );

    }

    lines.push("");

   });

 }else{

  lines.push("なし");

 }


 document
  .getElementById(
   "handoffText"
  )
  .value=
   lines.join("\n");

}


function openHandoff(){

 generateHandoff();

 document
  .getElementById(
   "handoffOverlay"
  )
  .style.display=
   "block";

}


function closeHandoff(){

 document

}

/* ---------- カレンダー ---------- */

const now=new Date();

let calendarYear=
 now.getFullYear();

let calendarMonth=
 now.getMonth();


function changeMonth(diff){

 calendarMonth+=diff;

 if(calendarMonth<0){

  calendarMonth=11;
  calendarYear--;

 }

 if(calendarMonth>11){

  calendarMonth=0;
  calendarYear++;

 }

 renderCalendar();

}


function goToday(){

 const d=new Date();

 calendarYear=
  d.getFullYear();

 calendarMonth=
  d.getMonth();

 renderCalendar();

}


function openPatientFromCalendar(id){

 const p=
  patients.find(
   x=>x.id===id
  );

 if(!p)return;

 showTab(
  p.location==="outpatient"
  ?"outpatient"
  :"ward"
 );

 setTimeout(()=>{

  const card=
   document.getElementById(
    "patient-"+id
   );

  if(!card)return;

  card.scrollIntoView({
   behavior:"smooth",
   block:"center"
  });

  card.style.outline=
   "3px solid #007aff";

  setTimeout(()=>{

   card.style.outline="";

  },1500);

 },50);

}


function renderCalendar(){

 const grid=
  document.getElementById(
   "calendarGrid"
  );

 document
  .getElementById(
   "calendarTitle"
  )
  .textContent=
   `${calendarYear}年 ${calendarMonth+1}月`;

 grid.innerHTML="";

 const first=
  new Date(
   calendarYear,
   calendarMonth,
   1
  );

 const start=
  new Date(first);

 start.setDate(
  1-first.getDay()
 );

 for(
  let i=0;
  i<42;
  i++
 ){

  const d=
   new Date(start);

  d.setDate(
   start.getDate()+i
  );

  const ds=
   formatDateLocal(d);

  const cell=
   document.createElement(
    "div"
   );

  cell.className=
   "dayCell";

  if(
   d.getMonth()!==
    calendarMonth
  ){

   cell.classList.add(
    "otherMonth"
   );

  }

  if(
   ds===todayString()
  ){

   cell.classList.add(
    "todayCell"
   );

  }

  const number=
   document.createElement(
    "div"
   );

  number.className=
   "dayNumber";

  number.textContent=
   d.getDate();

  cell.appendChild(
   number
  );

  const todos=[];

  patients.forEach(p=>{

   p.todos.forEach(t=>{

    if(
     t.dueDate===ds &&
     t.priority==="high"
    ){

     todos.push({

      patient:p,
      todo:t

     });

    }

   });

  });


  /*
   全件表示。
   sliceによる省略なし。
  */

  todos.forEach(item=>{

   const el=
    document.createElement(
     "div"
    );

   el.className=
    "calTodo"+
    (
     item.todo.done
     ?" completed"
     :""
    );

   const patientName=

    (
     item.patient.location===
      "ward"
     &&
     item.patient.room

     ?item.patient.room+" "

     :""
    )

    +

    (
     item.patient.location===
      "outpatient"

     ?"外 "

     :""
    )

    +

    (
     item.patient.initial||
     "?"
    );


   el.textContent=
    patientName+
    " "+
    item.todo.text;


   el.onclick=()=>{

    openPatientFromCalendar(
     item.patient.id
    );

   };


   cell.appendChild(el);

  });


  grid.appendChild(cell);

 }

}


/* ---------- バックアップ ---------- */

async function backupData(){

 const backup={

  app:"Hospi Todo",

  version:"8.1",

  exportedAt:
   new Date()
    .toISOString(),

  patients

 };


 const json=
  JSON.stringify(
   backup,
   null,
   2
  );


 const blob=
  new Blob(
   [json],
   {
    type:
     "application/json"
   }
  );


 const d=new Date();


 const filename=
  `hospi-todo-backup-`+
  `${formatDateLocal(d)}-`+
  `${String(
   d.getHours()
  ).padStart(2,"0")}`+
  `${String(
   d.getMinutes()
  ).padStart(2,"0")}`+
  `.json`;


 const file=
  new File(
   [blob],
   filename,
   {
    type:
     "application/json"
   }
  );


 if(
  navigator.canShare
  &&
  navigator.canShare({
   files:[file]
  })
 ){

  try{

   await navigator.share({

    files:[file],

    title:
     "病棟ToDoバックアップ"

   });

   return;

  }catch(e){

   if(
    e.name==="AbortError"
   ){
    return;
   }

  }

 }


 const url=
  URL.createObjectURL(
   blob
  );


 const a=
  document.createElement(
   "a"
  );

 a.href=url;
 a.download=filename;

 document.body
  .appendChild(a);

 a.click();
 a.remove();

 setTimeout(()=>{

  URL.revokeObjectURL(
   url
  );

 },1000);

}


/* ---------- 復元 ---------- */

document
 .getElementById(
  "restoreFile"
 )
 .addEventListener(
  "change",
  function(e){

   const file=
    e.target.files[0];

   if(!file)return;

   const reader=
    new FileReader();


   reader.onload=
    function(){

     try{

      const backup=
       JSON.parse(
        reader.result
       );


      if(
       !backup
       ||
       !Array.isArray(
        backup.patients
       )
      ){

       alert(
        "バックアップ形式が正しくありません"
       );

       return;

      }


      if(
       !confirm(
        "現在のデータをバックアップ内容で上書きしますか？"
       )
      ){
       return;
      }


      patients=
       normalizePatients(
        backup.patients
       );


      save();
      renderAll();


      alert(
       "バックアップを復元しました"
      );


     }catch(error){

      alert(
       "バックアップを読み込めませんでした"
      );

     }


     e.target.value="";

    };


   reader.readAsText(
    file
   );

  }
 );


function renderAll(){

 renderWard();
 renderOutpatient();
 renderBloodPatients();
 renderCalendar();

}


renderAll();
