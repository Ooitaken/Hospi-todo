<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>病棟ToDo v1.10</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f2f2f7;color:#151515}
header{position:sticky;top:0;background:#fff;z-index:5;padding:12px 10px 8px;border-bottom:1px solid #ddd}
h2{margin:0 0 8px;font-size:20px}
.tabs,.actions{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
button{border:0;border-radius:8px;background:#e5e5ea;padding:9px;font-weight:600}
button.primary,.tabs button.selected{background:#087bfa;color:#fff}
.tabs button{flex:1;font-size:12px}
main{padding:10px;max-width:900px;margin:auto}
.card{background:white;border-radius:12px;padding:12px;margin-bottom:10px}
.top{display:flex;gap:6px}
.top input:first-child{width:75px}
.top input:nth-child(2){flex:1;min-width:0}
input,textarea,select{font:inherit;border:1px solid #ccc;border-radius:7px;padding:8px;min-width:0}
textarea{width:100%;min-height:55px;margin-top:8px}
details{background:#f7f7fa;border-radius:9px;margin-top:9px;padding:8px}
summary{font-weight:700;cursor:pointer;padding:3px}
.line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #eee}
.line label{min-width:68px}
.line input[type=date]{flex:1}
.line input[type=checkbox]{width:20px;height:20px}
.line .grow{flex:1;min-width:80px}
.red{color:#a50000}
.warn{color:#aa6600}
.pill{font-size:12px;border-radius:8px;background:#eee;padding:4px 6px}
.small{font-size:12px;color:#666}
.done{text-decoration:line-through;opacity:.55}
.alert{padding:6px;margin:5px 0;background:#fff0c8;border-radius:7px;font-size:13px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{background:white;min-height:75px;border-radius:6px;padding:3px;overflow-wrap:anywhere;font-size:11px}
.calitem{background:#ffdada;margin:3px 0;padding:3px;border-radius:4px;font-size:10px}
.calitem.done{opacity:.45}
.hidden{display:none}
#handoffPanel{position:fixed;inset:0;background:#f2f2f7;z-index:20;padding:15px;overflow:auto}
#handoffText{height:75vh}
button.danger{background:#ffe0e0;color:#a00000}
.examTags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px 80px}
.examTag{background:#e4f0ff;color:#1453a0;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
.examTag button{background:transparent;padding:0 0 0 6px;color:#1453a0}
.groupTitle{font-weight:800;font-size:17px;margin:15px 2px 8px}
.filterBar{display:flex;gap:5px;flex-wrap:wrap}
.filterBar button.active{background:#087bfa;color:white}
.examChoices{display:flex;gap:7px;flex-wrap:wrap}
.examChoices button.active{background:#087bfa;color:white}
.note{font-size:12px;color:#666;margin:7px 0}
</style>
</head>
<body>

<header>
<h2>病棟ToDo <span class="small">v1.10</span></h2>
<div class="tabs">
<button id="tab-ward" onclick="showTab('ward')">病棟</button>
<button id="tab-outpatient" onclick="showTab('outpatient')">外来</button>
<button id="tab-blood" onclick="showTab('blood')">検査</button>
<button id="tab-calendar" onclick="showTab('calendar')">カレンダー</button>
</div>
</header>

<main>
<div id="ward"></div>
<div id="outpatient" class="hidden"></div>
<div id="blood" class="hidden"></div>
<div id="calendar" class="hidden"></div>
</main>

<div id="handoffPanel" class="hidden">
<div class="actions">
<button onclick="document.getElementById('handoffPanel').classList.add('hidden')">戻る</button>
<button onclick="generateHandoff()">再生成</button>
<button onclick="copyHandoff()" class="primary">コピー</button>
</div>
<textarea id="handoffText"></textarea>
</div>

<input id="restoreFile" type="file" accept=".json,application/json" class="hidden">

<script>
'use strict';

const KEY='hospiTodo';
const openSections=new Set();
const examNames=['採血','Xp','TDM','ECG'];

let tab='ward';
let bloodGroup='ward';
let sortMode='manual';
let calendarOffset=0;
let wardFilter='all';
let selectedExam='採血';
let selectedExamDate='';

const $=id=>document.getElementById(id);

const today=()=>{
 const d=new Date();
 return [
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,'0'),
  String(d.getDate()).padStart(2,'0')
 ].join('-');
};

const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));

const state=v=>typeof v==='string'
 ?{date:v,noPlan:false}
 :{date:v?.date||'',noPlan:!!v?.noPlan};

function normalize(p){
 const o=p.orders||{};
 const h=p.handoff||{};

 return {
  id:String(p.id||id()),
  location:p.location==='outpatient'?'outpatient':'ward',
  room:p.room||'',
  initial:p.initial||'',
  memo:p.memo||'',
  finished:!!p.finished,
  admissionDate:p.admissionDate||'',
  dischargeDate:p.dischargeDate||'',
  plannedAdmission:state(p.plannedAdmission||p.admissionPlan),
  plannedAdmissionRoom:p.plannedAdmissionRoom||'',
  plannedDischarge:state(p.plannedDischarge||p.dischargePlan),
  orders:{
   blood:state(o.blood),
   drip:state(o.drip),
   procedure:state(o.procedure),
   prescription:state(o.prescription)
  },
  todos:(p.todos||[]).map(t=>({
   id:String(t.id||id()),
   text:t.text||'',
   done:!!t.done,
   priority:t.priority||'normal',
   dueDate:t.dueDate||(t.timing==='today'?today():''),
   exam:examNames.includes(t.exam)
    ?t.exam
    :(examNames.includes(t.text)?t.text:'')
  })),
  handoff:{
   regimen:h.regimen||p.regimen||'',
   mood:h.mood||'',
   note:h.note||'',
   category:h.category==='consult'?'consult':'ward'
  }
 };
}

let patients=[];
let storageReady=true;

try{
 const raw=localStorage.getItem(KEY);

 if(raw!==null){
  const parsed=JSON.parse(raw);
  if(!Array.isArray(parsed))throw Error('invalid');
  patients=parsed.map(normalize);
 }
}catch(e){
 storageReady=false;
 alert('保存データを読み込めません。元データを上書きせず、バックアップから復元してください。');
}

function save(){
 if(!storageReady){
  alert('保存を停止しています。バックアップから復元してください。');
  return;
 }

 try{
  localStorage.setItem(KEY,JSON.stringify(patients));
 }catch(e){
  alert('保存に失敗しました。');
 }
}

function patient(pid){
 return patients.find(p=>p.id===pid);
}

function newPatient(){
 return normalize({
  id:id(),
  location:tab==='outpatient'?'outpatient':'ward'
 });
}

function addPatient(){
 patients.push(newPatient());
 save();
 rerender();
}

function setField(pid,key,value){
 const p=patient(pid);
 if(!p)return;
 p[key]=value;
 save();
}

function setHandoff(pid,key,value){
 const p=patient(pid);
 if(!p)return;
 p.handoff[key]=value;
 save();
}

function sectionAttr(pid,key){
 return `data-section="${key}" ${openSections.has(pid+':'+key)?'open':''}`;
}

function rememberSection(el,pid,key){
 const k=pid+':'+key;
 if(el.open)openSections.add(k);
 else openSections.delete(k);
}

function snapshotSections(){
 document.querySelectorAll('details[data-section]').forEach(el=>{
  const card=el.closest('[data-pid]');
  if(card){
   rememberSection(el,card.dataset.pid,el.dataset.section);
  }
 });
}

function rerender(){
 snapshotSections();
 render();
}

function tomorrow(){
 const d=new Date();
 d.setDate(d.getDate()+1);
 return [
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,'0'),
  String(d.getDate()).padStart(2,'0')
 ].join('-');
}

function status(s){
 if(s.noPlan)return ['予定なし',''];
 if(!s.date)return ['未入力',''];
 if(s.date<today())return ['期限切れ','red'];
 if(s.date===today())return ['今日','warn'];
 if(s.date===tomorrow())return ['明日','warn'];
 return ['予定あり',''];
}

const defs=[
 ['blood','採血'],
 ['drip','点滴'],
 ['procedure','処置'],
 ['prescription','処方']
];

function orderCounts(p){
 const c={expired:0,today:0,tomorrow:0};

 defs.forEach(([k])=>{
  const s=status(p.orders[k])[0];
  if(s==='期限切れ')c.expired++;
  if(s==='今日')c.today++;
  if(s==='明日')c.tomorrow++;
 });

 return c;
}

function orderLabel(p){
 const c=orderCounts(p);

 return `オーダー確認${c.expired?' 🔴期限切れ '+c.expired:''}${c.today?' 🟡今日 '+c.today:''}${c.tomorrow?' 🟠明日 '+c.tomorrow:''}`;
}

function dateRow(p,group,key,label){
 const s=group==='orders'?p.orders[key]:p[key];
 const st=status(s);

 return `
 <div class="line">
 <label>${label}</label>
 <input type="date"
 value="${esc(s.date)}"
 ${s.noPlan?'disabled':''}
 onchange="setDate('${p.id}','${group}','${key}',this.value)">
 <button onclick="noPlan('${p.id}','${group}','${key}')">
 ${s.noPlan?'✓ ':''}予定なし
 </button>
 <span class="pill ${st[1]}">${st[0]}</span>
 </div>`;
}

function setDate(pid,group,key,date){
 const p=patient(pid);
 if(!p)return;

 const s=group==='orders'?p.orders[key]:p[key];
 s.date=date;
 if(date)s.noPlan=false;

 save();
 rerender();
}

function noPlan(pid,group,key){
 const p=patient(pid);
 if(!p)return;

 const s=group==='orders'?p.orders[key]:p[key];
 s.noPlan=!s.noPlan;
 if(s.noPlan)s.date='';

 save();
 rerender();
}

function addTodo(pid){
 const p=patient(pid);
 const t=$('todo-text-'+pid);
 const pr=$('todo-pr-'+pid);
 const dt=$('todo-date-'+pid);

 if(!p||!t.value.trim())return;

 p.todos.push({
  id:id(),
  text:t.value.trim(),
  done:false,
  priority:pr.value,
  dueDate:dt.value,
  exam:''
 });

 openSections.add(pid+':todo');
 save();
 rerender();
}

function toggleTodo(pid,tid){
 const p=patient(pid);
 const t=p?.todos.find(x=>x.id===tid);
 if(!t)return;

 t.done=!t.done;
 openSections.add(pid+':todo');
 save();
 rerender();
}

function deleteTodo(pid,tid){
 if(!confirm('このToDoを削除しますか？'))return;

 const p=patient(pid);
 if(!p)return;

 p.todos=p.todos.filter(t=>t.id!==tid);
 openSections.add(pid+':todo');
 save();
 rerender();
}

function isExam(t,name){
 return t.exam===name||(!t.exam&&t.text===name);
}

function pendingExams(p){
 return examNames.filter(name=>
  p.todos.some(t=>!t.done&&isExam(t,name))
 );
}

function examTagsHTML(p){
 const items=[];

 for(const name of examNames){
  const pending=p.todos.filter(t=>!t.done&&isExam(t,name));
  if(!pending.length)continue;

  const future=pending
   .filter(t=>t.dueDate&&t.dueDate>today())
   .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

  const hasCurrent=pending.some(t=>!t.dueDate||t.dueDate<=today());

  const dates=[
   ...(hasCurrent?['']:[]),
   ...future.map(t=>`(${Number(t.dueDate.slice(5,7))}/${Number(t.dueDate.slice(8,10))})`)
  ];

  for(const suffix of [...new Set(dates)]){
   items.push(`
   <span class="examTag">
   #${name}${suffix}
   <button title="この検査を完了"
   onclick="finishExam('${p.id}','${name}','${suffix}')">✓</button>
   </span>`);
  }
 }

 return items.length
  ?`<div class="examTags">${items.join('')}</div>`
  :'';
}

function finishExam(pid,name,suffix){
 const p=patient(pid);
 if(!p)return;

 const pending=p.todos.filter(t=>{
  if(t.done||!isExam(t,name))return false;

  const d=t.dueDate;
  const tag=d&&d>today()
   ?`(${Number(d.slice(5,7))}/${Number(d.slice(8,10))})`
   :'';

  return tag===suffix;
 });

 if(!pending.length)return;

 if(!confirm(`#${name}${suffix} の${pending.length}件を完了にしますか？`)){
  return;
 }

 pending.forEach(t=>t.done=true);
 save();
 rerender();
}

function todoHTML(p){
 const active=p.todos.filter(t=>!t.done).length;
 const late=p.todos.filter(t=>!t.done&&t.dueDate&&t.dueDate<today()).length;

 return `
 <details ${sectionAttr(p.id,'todo')}>
 <summary>ToDo（未完了 ${active}）${late?' 🔴期限超過 '+late:''}</summary>

 ${p.todos.map(t=>`
 <div class="line">
 <input type="checkbox" ${t.done?'checked':''}
 onchange="toggleTodo('${p.id}','${t.id}')">

 <span class="grow ${t.done?'done':''}">${esc(t.text)}</span>

 <span class="pill">
 ${t.priority==='high'?'高':t.priority==='low'?'低':'通常'}
 </span>

 <span class="small ${!t.done&&t.dueDate&&t.dueDate<today()?'red':''}">
 ${esc(t.dueDate)}
 </span>

 <button class="danger" onclick="deleteTodo('${p.id}','${t.id}')">×</button>
 </div>`).join('')}

 <div class="line">
 <input class="grow" id="todo-text-${p.id}" placeholder="ToDo">

 <select id="todo-pr-${p.id}">
 <option value="normal">通常</option>
 <option value="high">高</option>
 <option value="low">低</option>
 </select>

 <input type="date" id="todo-date-${p.id}" value="${today()}">

 <button class="primary" onclick="addTodo('${p.id}')">追加</button>
 </div>
 </details>`;
}

function move(pid,target){
 const p=patient(pid);
 if(!p)return;

 if(!confirm(target==='ward'
  ?'病棟患者へ移動しますか？'
  :'外来患者へ移動しますか？'))return;

 p.location=target;

 if(target==='ward'){
  if(!p.room&&p.plannedAdmissionRoom){
   p.room=p.plannedAdmissionRoom;
  }

  if(p.plannedAdmission.date&&!p.plannedAdmission.noPlan){
   p.admissionDate=p.plannedAdmission.date;
  }
 }else if(!p.dischargeDate){
  p.dischargeDate=today();
 }

 save();
 rerender();
}

function removePatient(pid){
 if(!confirm('患者を削除しますか？'))return;

 patients=patients.filter(p=>p.id!==pid);
 save();
 rerender();
}

function finish(pid){
 const p=patient(pid);
 if(!p)return;

 p.finished=!p.finished;
 save();
 rerender();
}

function moveOrder(pid,dir){
 const p=patient(pid);
 if(!p)return;

 const list=patients.filter(x=>x.location===p.location);
 const i=list.findIndex(x=>x.id===pid);
 const other=list[i+dir];
 if(!other)return;

 const a=patients.findIndex(x=>x.id===pid);
 const b=patients.findIndex(x=>x.id===other.id);

 [patients[a],patients[b]]=[patients[b],patients[a]];

 sortMode='manual';
 save();
 rerender();
}

function cardHTML(p){
 const ward=p.location==='ward';

 return `
 <article class="card" data-pid="${p.id}"
 style="${p.finished?'opacity:.6':''}">

 <div class="top">
 <input placeholder="${ward?'部屋':'予定病棟'}"
 value="${esc(ward?p.room:p.plannedAdmissionRoom)}"
 oninput="setField('${p.id}','${ward?'room':'plannedAdmissionRoom'}',this.value)">

 <input placeholder="イニシャル・疾患名"
 value="${esc(p.initial)}"
 oninput="setField('${p.id}','initial',this.value)">

 <button onclick="moveOrder('${p.id}',-1)">↑</button>
 <button onclick="moveOrder('${p.id}',1)">↓</button>
 </div>

 ${examTagsHTML(p)}

 <textarea placeholder="📝 期限なしメモ"
 oninput="setField('${p.id}','memo',this.value)">${esc(p.memo)}</textarea>

 <div class="actions">
 ${ward?`<button onclick="finish('${p.id}')">${p.finished?'✓ 完了':'患者完了'}</button>`:''}

 <button onclick="move('${p.id}','${ward?'outpatient':'ward'}')">
 ${ward?'外来へ':'病棟へ'}
 </button>

 <button class="danger" onclick="removePatient('${p.id}')">削除</button>
 </div>

 ${todoHTML(p)}

 <details ${sectionAttr(p.id,'admission')}>
 <summary>${ward?'入退院情報':'入院予定'}</summary>

 ${ward?`
 <div class="line">
 <label>入院日</label>
 <input type="date" value="${esc(p.admissionDate)}"
 onchange="setField('${p.id}','admissionDate',this.value)">
 </div>
 ${dateRow(p,'patient','plannedDischarge','退院予定')}
 `:`
 ${dateRow(p,'patient','plannedAdmission','入院予定')}

 <div class="line">
 <label>予定病棟</label>
 <input class="grow" value="${esc(p.plannedAdmissionRoom)}"
 oninput="setField('${p.id}','plannedAdmissionRoom',this.value)">
 </div>

 <div class="line">
 <label>予定治療</label>
 <input class="grow" value="${esc(p.handoff.regimen)}"
 oninput="setHandoff('${p.id}','regimen',this.value)">
 </div>
 `}
 </details>

 <details ${sectionAttr(p.id,'orders')}>
 <summary>${orderLabel(p)}</summary>
 ${defs.map(([k,label])=>dateRow(p,'orders',k,label)).join('')}
 </details>

 ${ward?`
 <details ${sectionAttr(p.id,'handoff')}>
 <summary>申し送り情報</summary>

 <div class="line">
 <label>区分</label>
 <select onchange="setHandoff('${p.id}','category',this.value)">
 <option value="ward" ${p.handoff.category==='ward'?'selected':''}>病棟メンバー</option>
 <option value="consult" ${p.handoff.category==='consult'?'selected':''}>兼科</option>
 </select>
 </div>

 <div class="line">
 <label>治療</label>
 <input class="grow" value="${esc(p.handoff.regimen)}"
 oninput="setHandoff('${p.id}','regimen',this.value)">
 </div>

 <div class="line">
 <label>状態</label>
 <select onchange="setHandoff('${p.id}','mood',this.value)">
 ${['','😀','😕','😢','🫠'].map(x=>`
 <option ${p.handoff.mood===x?'selected':''}>${x}</option>
 `).join('')}
 </select>
 </div>

 <textarea placeholder="申し送り本文"
 oninput="setHandoff('${p.id}','note',this.value)">${esc(p.handoff.note)}</textarea>
 </details>
 `:''}
 </article>`;
}

function sortedWard(){
 const a=patients.filter(p=>p.location==='ward');

 if(sortMode==='room'){
  a.sort((x,y)=>
   (x.room||'ZZZZ').localeCompare(y.room||'ZZZZ','ja',{numeric:true})
  );
 }

 if(sortMode==='admission'){
  a.sort((x,y)=>
   (x.admissionDate||'9999').localeCompare(y.admissionDate||'9999')
  );
 }

 return a;
}

function sortWard(mode){
 sortMode=mode;
 rerender();
}

function deleteDone(){
 if(!confirm('完了ToDoを全患者から削除しますか？'))return;

 patients.forEach(p=>{
  p.todos=p.todos.filter(t=>!t.done);
 });

 save();
 rerender();
}

function deleteFinished(){
 if(!confirm('完了患者を削除しますか？'))return;

 patients=patients.filter(p=>
  !(p.location==='ward'&&p.finished)
 );

 save();
 rerender();
}

function alertHTML(){
 const arr=[];

 patients
 .filter(p=>p.location==='ward'&&!p.finished)
 .forEach(p=>{
  defs.forEach(([k,label])=>{
   const s=status(p.orders[k])[0];

   if(['期限切れ','今日','明日'].includes(s)){
    arr.push(`${esc(p.room)} ${esc(p.initial)}：${label} ${s}`);
   }
  });

  p.todos
  .filter(t=>!t.done&&t.dueDate&&t.dueDate<today())
  .forEach(t=>{
   arr.push(`${esc(p.room)} ${esc(p.initial)}：ToDo期限超過 ${esc(t.text)}`);
  });
 });

 return `
 <details class="card">
 <summary>⚠️ 要確認 ${arr.length}件</summary>
 ${arr.length
  ?arr.map(s=>`<div class="alert">${s}</div>`).join('')
  :'<div class="small">期限切れ・期限間近の項目はありません</div>'}
 </details>`;
}

function setWardFilter(v){
 wardFilter=v;
 rerender();
}

function renderPatients(){
 const controls=`
 <div class="actions">
 <button class="primary" onclick="addPatient()">＋患者</button>
 <button onclick="backup()">バックアップ保存</button>
 <button onclick="$('restoreFile').click()">復元</button>
 </div>`;

 $('ward').innerHTML=controls+`
 <div class="actions">
 <button onclick="sortWard('room')">部屋順</button>
 <button onclick="sortWard('admission')">入院日順</button>
 <button onclick="generateHandoff();$('handoffPanel').classList.remove('hidden')">申し送り</button>
 <button onclick="deleteDone()">完了ToDo削除</button>
 <button class="danger" onclick="deleteFinished()">完了患者削除</button>
 </div>

 ${alertHTML()}

 <div class="card">
 <b>検査で絞り込み</b>
 <div class="filterBar">
 ${[['all','すべて'],...examNames.map(n=>[n,'#'+n])].map(([key,label])=>`
 <button class="${wardFilter===key?'active':''}"
 onclick="setWardFilter('${key}')">${label}</button>
 `).join('')}
 </div>
 </div>

 ${sortedWard()
  .filter(p=>wardFilter==='all'||pendingExams(p).includes(wardFilter))
  .map(cardHTML).join('')}`;

 const outpatients=patients.filter(p=>p.location==='outpatient');

 const scheduled=outpatients
  .filter(p=>p.plannedAdmission.date&&!p.plannedAdmission.noPlan)
  .sort((a,b)=>a.plannedAdmission.date.localeCompare(b.plannedAdmission.date));

 const other=outpatients.filter(p=>
  !p.plannedAdmission.date||p.plannedAdmission.noPlan
 );

 $('outpatient').innerHTML=controls+`
 <div class="groupTitle">📅 再入院予定あり（${scheduled.length}名）</div>
 ${scheduled.length
  ?scheduled.map(cardHTML).join('')
  :'<div class="card small">該当患者なし</div>'}

 <div class="groupTitle">その他の外来患者（${other.length}名）</div>
 ${other.length
  ?other.map(cardHTML).join('')
  :'<div class="card small">該当患者なし</div>'}`;
}

function examExists(p,name,date){
 return !!p&&p.todos.some(t=>
  t.dueDate===date&&isExam(t,name)
 );
}

function selectExam(name){
 selectedExam=name;
 rerender();
}

function setExamDate(v){
 selectedExamDate=v||today();
 refreshExamChecks();
}

function bloodGroupChange(v){
 bloodGroup=v;
 rerender();
}

function addExam(){
 const checks=[...document.querySelectorAll('.examCheck:checked')];

 if(!checks.length){
  alert('患者を選択してください');
  return;
 }

 const date=selectedExamDate||today();
 let n=0;

 checks.forEach(c=>{
  const p=patient(c.value);

  if(p&&!examExists(p,selectedExam,date)){
   p.todos.push({
    id:id(),
    text:selectedExam,
    exam:selectedExam,
    done:false,
    priority:'normal',
    dueDate:date
   });
   n++;
  }
 });

 save();
 rerender();
 alert(`${n}名に #${selectedExam} を登録しました`);
}

function renderBlood(){
 const list=patients.filter(p=>
  p.location===bloodGroup&&!p.finished
 );

 if(bloodGroup==='ward'){
  list.sort((a,b)=>
   (a.room||'ZZZZ').localeCompare(b.room||'ZZZZ','ja',{numeric:true})
  );
 }

 const date=selectedExamDate||today();

 $('blood').innerHTML=`
 <div class="card">
 <h3>検査の一括登録</h3>

 <div class="examChoices">
 ${examNames.map(n=>`
 <button class="${selectedExam===n?'active':''}"
 onclick="selectExam('${n}')">#${n}</button>
 `).join('')}
 </div>

 <div class="line">
 <label>検査日</label>
 <input id="examDate" type="date"
 value="${date}"
 onchange="setExamDate(this.value)">
 </div>

 <div class="actions">
 <button class="${bloodGroup==='ward'?'primary':''}"
 onclick="bloodGroupChange('ward')">入院</button>

 <button class="${bloodGroup==='outpatient'?'primary':''}"
 onclick="bloodGroupChange('outpatient')">外来</button>

 <button onclick="document.querySelectorAll('.examCheck:not(:disabled)').forEach(x=>x.checked=true)">全選択</button>

 <button onclick="document.querySelectorAll('.examCheck').forEach(x=>x.checked=false)">全解除</button>
 </div>

 <div id="examPatientList">
 ${list.map(p=>`
 <label class="line">
 <input class="examCheck" type="checkbox" value="${p.id}"
 ${examExists(p,selectedExam,date)?'disabled':''}>

 <span class="grow">${esc(p.room)} ${esc(p.initial)}</span>

 <span class="pill examStatus">
 ${examExists(p,selectedExam,date)?'登録済':''}
 </span>
 </label>
 `).join('')}
 </div>

 <div class="actions">
 <button class="primary" onclick="addExam()">
 #${selectedExam} を選択患者に登録
 </button>
 </div>

 <div class="note">
 同じ患者・同じ検査・同じ検査日の重複登録はしません。
 検査はToDoにも登録され、完了まで名前の下にタグ表示されます。
 </div>
 </div>`;
}

function refreshExamChecks(){
 const date=selectedExamDate||today();

 document.querySelectorAll('.examCheck').forEach(c=>{
  const found=examExists(patient(c.value),selectedExam,date);

  c.disabled=found;
  if(found)c.checked=false;

  c.parentElement.querySelector('.examStatus').textContent=
   found?'登録済':'';
 });
}

function renderCalendar(){
 const now=new Date();

 const d=new Date(
  now.getFullYear(),
  now.getMonth()+calendarOffset,
  1
 );

 const y=d.getFullYear();
 const m=d.getMonth();
 const start=new Date(y,m,1-d.getDay());

 let html='<div class="calendar">'+
  ['日','月','火','水','木','金','土']
  .map(x=>`<b>${x}</b>`)
  .join('');

 for(let i=0;i<42;i++){
  const day=new Date(start);
  day.setDate(start.getDate()+i);

  const ds=[
   day.getFullYear(),
   String(day.getMonth()+1).padStart(2,'0'),
   String(day.getDate()).padStart(2,'0')
  ].join('-');

  const items=[];

  patients.forEach(p=>{
   p.todos
   .filter(t=>t.priority==='high'&&t.dueDate===ds)
   .forEach(t=>{
    items.push(`
    <div class="calitem ${t.done?'done':''}">
    ${esc(p.room)} ${esc(p.initial)} ${esc(t.text)}
    </div>`);
   });
  });

  html+=`
  <div class="day"
  style="${day.getMonth()!==m?'opacity:.35;':''}${ds===today()?'outline:2px solid #087bfa;':''}">
  <b>${day.getDate()}</b>
  ${items.join('')}
  </div>`;
 }

 html+='</div>';

 $('calendar').innerHTML=`
 <div class="actions">
 <button onclick="calendarOffset--;rerender()">‹</button>
 <b>${y}年${m+1}月</b>
 <button onclick="calendarOffset++;rerender()">›</button>
 <button onclick="calendarOffset=0;rerender()">今月</button>
 </div>

 <div class="small">優先度「高」のToDoを全件表示</div>
 ${html}`;
}

function generateHandoff(){
 const lines=['<申し送り>',''];

 const add=(title,arr,fn)=>{
  lines.push(title);
  lines.push(...(arr.length?arr.map(fn):['なし']));
  lines.push('');
 };

 const label=p=>
  `${p.room||''} ${p.initial||'名称未入力'} ${p.handoff.regimen||''} ${p.handoff.mood||''}`.trim();

 add(
  '☆入院:',
  patients.filter(p=>p.admissionDate===today()),
  label
 );

 add(
  '☆退院:',
  patients.filter(p=>p.dischargeDate===today()),
  label
 );

 add(
  '☆入院予定:',
  patients
   .filter(p=>
    p.location==='outpatient'&&
    p.plannedAdmission.date&&
    !p.plannedAdmission.noPlan
   )
   .sort((a,b)=>
    a.plannedAdmission.date.localeCompare(b.plannedAdmission.date)
   ),
  p=>`${p.plannedAdmission.date} ${p.plannedAdmissionRoom} ${p.initial} ${p.handoff.regimen}`
 );

 add(
  '☆退院予定:',
  patients.filter(p=>
   p.location==='ward'&&
   p.plannedDischarge.date&&
   !p.plannedDischarge.noPlan
  ),
  p=>`${p.plannedDischarge.date} ${label(p)}`
 );

 add(
  '☆病棟メンバー',
  sortedWard().filter(p=>p.handoff.category==='ward'),
  p=>`${label(p)}\n${p.handoff.note}`
 );

 add(
  '☆兼科',
  sortedWard().filter(p=>p.handoff.category==='consult'),
  p=>`${label(p)}\n${p.handoff.note}`
 );

 $('handoffText').value=lines.join('\n');
}

async function copyHandoff(){
 try{
  await navigator.clipboard.writeText($('handoffText').value);
  alert('コピーしました');
 }catch(e){
  $('handoffText').select();
  document.execCommand('copy');
  alert('コピーを試みました');
 }
}

async function backup(){
 const b={
  app:'Hospi Todo',
  version:'1.10',
  exportedAt:new Date().toISOString(),
  patients
 };

 const blob=new Blob(
  [JSON.stringify(b,null,2)],
  {type:'application/json'}
 );

 const name=`hospi-todo-${today()}.json`;

 try{
  const file=new File([blob],name,{type:'application/json'});

  if(navigator.canShare?.({files:[file]})){
   await navigator.share({files:[file]});
   return;
  }
 }catch(e){
  if(e.name==='AbortError')return;
 }

 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');

 a.href=url;
 a.download=name;
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),2000);
}

$('restoreFile').addEventListener('change',async e=>{
 const file=e.target.files[0];
 if(!file)return;

 try{
  const data=JSON.parse(await file.text());

  if(!Array.isArray(data.patients)){
   throw Error('invalid');
  }

  if(!confirm('現在のデータを上書きして復元しますか？')){
   return;
  }

  patients=data.patients.map(normalize);
  storageReady=true;

  save();
  rerender();

  alert('復元しました');

 }catch(err){
  alert('バックアップ形式を確認してください');

 }finally{
  e.target.value='';
 }
});

function showTab(v){
 tab=v;
 rerender();
}

function render(){
 ['ward','outpatient','blood','calendar'].forEach(v=>{
  $(v).classList.toggle('hidden',v!==tab);
  $('tab-'+v).classList.toggle('selected',v===tab);
 });

 renderPatients();
 renderBlood();
 renderCalendar();

 document.querySelectorAll('details[data-section]').forEach(el=>{
  el.addEventListener('toggle',()=>{
   if(!el.isConnected)return;

   const card=el.closest('[data-pid]');
   if(card){
    rememberSection(
     el,
     card.dataset.pid,
     el.dataset.section
    );
   }
  });
 });
}

render();
</script>
